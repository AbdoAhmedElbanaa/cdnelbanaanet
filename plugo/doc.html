<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ ملفات الشرح | Glassmorphism Admin</title>
    
    <!-- الخطوط العربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- CodeMirror (محرر الأكواد) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    
    <!-- TinyMCE (محرر النصوص - Community Edition via cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: rgb(29,29,31);
            background: linear-gradient(90deg, rgba(29,29,31,1) 0%, rgba(56,15,66,1) 50%, rgba(20,40,70,1) 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Glassmorphism Classes */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .glass-panel {
            @apply glass rounded-2xl transition-all duration-300;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Sidebar Item Actions */
        .sidebar-item-actions {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .sidebar-item:hover .sidebar-item-actions,
        .sidebar-category:hover .sidebar-item-actions {
            opacity: 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        /* Editor Overrides */
        .CodeMirror {
            height: 500px !important;
            border-radius: 0.5rem;
            font-family: 'Fira Code', monospace;
            direction: ltr;
        }
        .tox-tinymce {
            border-radius: 0.5rem !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal Animation */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 0.2s, transform 0.2s; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: opacity 0.2s, transform 0.2s; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col h-screen">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 glass-panel p-4 fade-in">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-purple-600 rounded-lg shadow-lg">
                <i data-lucide="layout" class="text-white"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">محرر التوثيق الذكي</h1>
                <p class="text-xs text-gray-300 opacity-70">إدارة وإنشاء ملفات الشرح JSON</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="previewContent()" class="glass-btn px-4 py-2 rounded-lg flex items-center gap-2 text-sm">
                <i data-lucide="eye" size="16"></i> معاينة
            </button>
            <button onclick="downloadJson()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white px-6 py-2 rounded-lg flex items-center gap-2 shadow-lg transition-all transform hover:scale-105">
                <i data-lucide="download" size="18"></i> تحميل JSON
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-col md:flex-row gap-6 flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-full md:w-1/4 glass-panel p-4 flex flex-col overflow-hidden fade-in" style="animation-delay: 0.1s;">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
                <h2 class="font-bold flex items-center gap-2 text-sm">
                    <i data-lucide="folder-tree" class="text-purple-400" size="16"></i>
                    هيكل الملف
                </h2>
                <div class="flex gap-1">
                    <button onclick="addNewCategory()" class="p-1.5 hover:bg-white/10 rounded text-yellow-400 transition-colors" title="إضافة قسم جديد">
                        <i data-lucide="folder-plus" size="16"></i>
                    </button>
                    <button onclick="addNewItem()" class="p-1.5 hover:bg-white/10 rounded text-green-400 transition-colors" title="إضافة صفحة جديدة">
                        <i data-lucide="plus-circle" size="16"></i>
                    </button>
                </div>
            </div>
            
            <div id="sidebar-content" class="flex-1 overflow-y-auto space-y-1 pr-1 pb-4">
                <!-- Items will be injected here via JS -->
            </div>
        </aside>

        <!-- Editor Area -->
        <main class="flex-1 glass-panel p-6 flex flex-col overflow-y-auto fade-in relative" style="animation-delay: 0.2s;">
            
            <div id="editor-container">
                <!-- Metadata Controls -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm text-gray-300">عنوان الصفحة (Label)</label>
                        <input type="text" id="page-label" class="bg-black/20 border border-white/10 rounded-lg p-2 text-white focus:outline-none focus:border-purple-500 transition-colors">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm text-gray-300">المعرف الفريد (ID)</label>
                        <input type="text" id="page-id" readonly class="bg-black/40 border border-white/10 rounded-lg p-2 text-gray-400 cursor-not-allowed">
                    </div>
                </div>

                <!-- Editor Tabs -->
                <div class="flex gap-1 mb-0 border-b border-white/10">
                    <button onclick="switchTab('visual')" id="tab-visual" class="px-4 py-2 bg-white/10 rounded-t-lg text-sm border-t border-r border-l border-white/10 text-purple-300 font-bold">
                        محرر مرئي (TinyMCE)
                    </button>
                    <button onclick="switchTab('code')" id="tab-code" class="px-4 py-2 hover:bg-white/5 rounded-t-lg text-sm text-gray-400 transition-colors">
                        محرر الكود (CodeMirror)
                    </button>
                </div>

                <!-- Editors -->
                <div class="relative bg-white/5 p-1 rounded-b-lg rounded-tr-lg border border-white/10 min-h-[500px]">
                    <div id="visual-editor-wrapper" class="block">
                        <textarea id="tinymce-editor"></textarea>
                    </div>
                    <div id="code-editor-wrapper" class="hidden h-full">
                        <textarea id="codemirror-editor"></textarea>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="mt-4 flex justify-end gap-3">
                    <button onclick="saveCurrentPage()" class="glass-btn bg-blue-600/20 text-blue-300 hover:bg-blue-600/40 px-6 py-2 rounded-lg flex items-center gap-2">
                        <i data-lucide="save" size="16"></i> حفظ التعديلات
                    </button>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden h-full flex flex-col items-center justify-center text-center opacity-50">
                <i data-lucide="mouse-pointer-click" size="64" class="mb-4"></i>
                <h3 class="text-2xl font-bold">اختر عنصراً للتعديل</h3>
                <p>قم باختيار صفحة من القائمة الجانبية للبدء.</p>
            </div>
        </main>
    </div>

    <!-- Interactive Custom Modal (Confirm/Prompt) -->
    <div id="custom-modal" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="custom-modal-panel" class="glass-panel w-full max-w-md p-6 transform transition-all scale-95 opacity-0">
            <h3 id="modal-title" class="text-xl font-bold mb-3 text-white">عنوان</h3>
            <p id="modal-message" class="text-gray-300 mb-5 text-sm leading-relaxed">رسالة</p>
            
            <div id="modal-input-container" class="mb-6 hidden">
                <input type="text" id="modal-input" class="w-full bg-black/30 border border-white/10 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 transition-colors shadow-inner" placeholder="اكتب هنا...">
            </div>
            
            <div class="flex justify-end gap-3">
                <button id="modal-cancel" class="px-4 py-2 rounded-lg text-sm bg-white/5 hover:bg-white/10 text-gray-300 border border-white/5 transition-colors">إلغاء</button>
                <button id="modal-confirm" class="px-6 py-2 rounded-lg text-sm bg-purple-600 hover:bg-purple-700 text-white shadow-lg shadow-purple-900/20 transition-all font-medium">موافق</button>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white text-gray-900 w-full max-w-4xl h-[80vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg">معاينة المحتوى الحالي</h3>
                <button onclick="closePreview()" class="text-gray-500 hover:text-red-500">
                    <i data-lucide="x" size="24"></i>
                </button>
            </div>
            <div class="flex-1 overflow-auto p-8 bg-white" id="preview-content-area"></div>
        </div>
    </div>

    <script>
        // --- 1. Initial Data Structure ---
        let projectData = [
            {
                "sidebar": {
                    "title": "ملف شرح القالب",
                    "items": [
                        { "type": "doc", "id": "introduction", "label": "Introduction" },
                        { "type": "doc", "id": "getting-started", "label": "Getting Started" },
                        {
                            "type": "category",
                            "label": "Guides",
                            "items": [
                                { "type": "doc", "id": "installation", "label": "Installation Guide" },
                                { "type": "doc", "id": "configuration", "label": "Configuration Guide" }
                            ]
                        }
                    ]
                },
                "content": {
                    "introduction": {
                        "id": "introduction",
                        "title": "Introduction",
                        "body": "<div id=\"doc-intro\" class=\"docs-content-pane active\"> <h1 class=\"text-4xl md:text-5xl font-black text-purple-600 mb-8\">مرحباً بك في SeoWriting V2.0</h1> <p class=\"text-lg md:text-xl text-gray-600 leading-relaxed mb-12\"> شكراً لثقتك بنا. هذا القالب تم تصميمه بعناية فائقة ليمنحك أفضل أداء ممكن. </p> </div>"
                    },
                    "getting-started": {
                        "id": "getting-started",
                        "title": "Getting Started",
                        "body": "<h2>البدء في الاستخدام</h2><p>هذا القسم يشرح الخطوات الأولية...</p>"
                    },
                    "installation": {  
                        "id": "installation",
                        "title": "Installation Guide",
                        "body": "<h2>دليل التثبيت</h2><p>اتبع الخطوات التالية لتثبيت القالب...</p>"
                    },
                    "configuration": {
                        "id": "configuration",
                        "title": "Configuration Guide",
                        "body": "<h2>الإعدادات</h2><p>كيفية تهيئة القالب ليناسب احتياجاتك...</p>"
                    }
                }
            }
        ];

        let activeDocId = 'introduction';
        let codeMirrorInstance = null;
        let activeTab = 'visual';

        // --- 2. Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initCodeMirror();
            initTinyMCE().then(() => {
                renderSidebar();
                loadDocContent(activeDocId);
            });
        });

        function initCodeMirror() {
            const textarea = document.getElementById('codemirror-editor');
            codeMirrorInstance = CodeMirror.fromTextArea(textarea, {
                mode: 'xml', htmlMode: true, theme: 'dracula', lineNumbers: true, autoCloseTags: true, lineWrapping: true
            });
        }

        function initTinyMCE() {
            return tinymce.init({
                selector: '#tinymce-editor',
                height: 500,
                plugins: 'anchor autolink charmap codesample emoticons image link lists media searchreplace table visualblocks wordcount code',
                toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table | align lineheight | numlist bullist indent outdent | emoticons charmap | removeformat | code',
                skin: 'oxide-dark',
                content_css: 'dark',
                directionality: 'rtl',
                promotion: false,
                branding: false
            });
        }

        // --- 3. Custom Modal Logic (The New Part) ---
        function showCustomModal(type, title, message, defaultValue = '') {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-modal');
                const panel = document.getElementById('custom-modal-panel');
                const titleEl = document.getElementById('modal-title');
                const messageEl = document.getElementById('modal-message');
                const inputContainer = document.getElementById('modal-input-container');
                const inputEl = document.getElementById('modal-input');
                const confirmBtn = document.getElementById('modal-confirm');
                const cancelBtn = document.getElementById('modal-cancel');

                // Set Content
                titleEl.textContent = title;
                messageEl.textContent = message;

                // Reset & Setup Input
                if (type === 'prompt') {
                    inputContainer.classList.remove('hidden');
                    inputEl.value = defaultValue;
                    // Auto-focus after a slight delay to ensure visibility
                    setTimeout(() => inputEl.focus(), 50);
                    
                    // Allow Enter key to submit
                    inputEl.onkeyup = (e) => {
                        if(e.key === 'Enter') confirmBtn.click();
                    };
                } else {
                    inputContainer.classList.add('hidden');
                    inputEl.onkeyup = null;
                }

                // Style Confirm Button based on type
                if (type === 'confirm-delete') {
                    confirmBtn.className = "px-6 py-2 rounded-lg text-sm bg-red-600 hover:bg-red-700 text-white shadow-lg shadow-red-900/20 transition-all font-medium";
                    confirmBtn.textContent = "حذف";
                } else {
                    confirmBtn.className = "px-6 py-2 rounded-lg text-sm bg-purple-600 hover:bg-purple-700 text-white shadow-lg shadow-purple-900/20 transition-all font-medium";
                    confirmBtn.textContent = "حفظ";
                }

                // Show Modal
                modal.classList.remove('hidden');
                // Simple entry animation
                requestAnimationFrame(() => {
                    panel.classList.remove('scale-95', 'opacity-0');
                    panel.classList.add('scale-100', 'opacity-100');
                });

                // Handlers
                const close = () => {
                    panel.classList.remove('scale-100', 'opacity-100');
                    panel.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => {
                        modal.classList.add('hidden');
                    }, 200);
                };

                confirmBtn.onclick = () => {
                    if (type === 'prompt') {
                        const val = inputEl.value.trim();
                        if (val) {
                            close();
                            resolve(val);
                        } else {
                            inputEl.classList.add('border-red-500'); // Error feedback
                            setTimeout(() => inputEl.classList.remove('border-red-500'), 1000);
                        }
                    } else {
                        close();
                        resolve(true);
                    }
                };

                cancelBtn.onclick = () => {
                    close();
                    resolve(null);
                };
            });
        }

        // --- 4. Enhanced Sidebar Logic ---
        function renderSidebar() {
            const container = document.getElementById('sidebar-content');
            container.innerHTML = '';
            const items = projectData[0].sidebar.items;

            items.forEach((item, index) => {
                if (item.type === 'category') {
                    // Render Category Container
                    const catContainer = document.createElement('div');
                    catContainer.className = 'mb-2 sidebar-category group';
                    
                    // Category Header
                    const header = document.createElement('div');
                    header.className = 'flex items-center justify-between px-3 py-2 text-gray-400 hover:text-white transition-colors';
                    header.innerHTML = `
                        <span class="text-xs font-bold uppercase tracking-wider flex-1">${item.label}</span>
                        <div class="sidebar-item-actions flex gap-1">
                            <button onclick="addItemToCategory(${index})" class="p-1 hover:bg-white/10 rounded text-green-400" title="إضافة صفحة"><i data-lucide="plus" size="14"></i></button>
                            <button onclick="editCategory(${index})" class="p-1 hover:bg-white/10 rounded text-blue-400" title="تعديل الاسم"><i data-lucide="pencil" size="14"></i></button>
                            <button onclick="deleteCategory(${index})" class="p-1 hover:bg-white/10 rounded text-red-400" title="حذف القسم"><i data-lucide="trash-2" size="14"></i></button>
                        </div>
                    `;
                    catContainer.appendChild(header);

                    // Category Items
                    if(item.items) {
                        item.items.forEach((subItem, subIndex) => {
                            catContainer.appendChild(createSidebarItem(subItem, item.items));
                        });
                    }
                    container.appendChild(catContainer);
                } else {
                    // Root Items
                    container.appendChild(createSidebarItem(item, items));
                }
            });
            lucide.createIcons();
        }

        function createSidebarItem(item, parentArray) {
            const div = document.createElement('div');
            const isActive = item.id === activeDocId;
            
            div.className = `sidebar-item flex items-center justify-between p-3 rounded-lg cursor-pointer transition-all mb-1 group ${
                isActive 
                ? 'bg-purple-600/30 border border-purple-500/50 text-white shadow-lg' 
                : 'text-gray-300 hover:bg-white/5 hover:text-white'
            }`;
            
            // Click handler (prevents firing when clicking delete)
            div.onclick = (e) => {
                if (!e.target.closest('.delete-btn')) {
                    loadDocContent(item.id);
                }
            };

            div.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <i data-lucide="file-text" size="16" class="${isActive ? 'text-purple-300' : 'text-gray-500'} flex-shrink-0"></i>
                    <span class="text-sm font-medium truncate">${item.label}</span>
                </div>
                <div class="sidebar-item-actions">
                    <button onclick="deleteItem('${item.id}')" class="delete-btn p-1.5 hover:bg-red-500/20 rounded text-red-400 transition-colors" title="حذف">
                        <i data-lucide="trash-2" size="14"></i>
                    </button>
                </div>
            `;
            return div;
        }

        // --- 5. CRUD Operations (Updated to use showCustomModal) ---

        async function addNewCategory() {
            const name = await showCustomModal('prompt', 'إضافة قسم جديد', 'أدخل اسم القسم الجديد:', 'قسم جديد');
            if (name) {
                projectData[0].sidebar.items.push({
                    type: 'category',
                    label: name,
                    items: []
                });
                renderSidebar();
            }
        }

        async function editCategory(index) {
            const currentLabel = projectData[0].sidebar.items[index].label;
            const newName = await showCustomModal('prompt', 'تعديل اسم القسم', 'أدخل الاسم الجديد للقسم:', currentLabel);
            if (newName) {
                projectData[0].sidebar.items[index].label = newName;
                renderSidebar();
            }
        }

        async function deleteCategory(index) {
            const confirmed = await showCustomModal('confirm-delete', 'حذف القسم', 'هل أنت متأكد من حذف هذا القسم وكل محتوياته؟ لا يمكن التراجع عن هذا الإجراء.');
            if (confirmed) {
                const category = projectData[0].sidebar.items[index];
                // Clean up content data for items inside
                if (category.items) {
                    category.items.forEach(item => {
                        if (projectData[0].content[item.id]) delete projectData[0].content[item.id];
                    });
                }
                projectData[0].sidebar.items.splice(index, 1);
                renderSidebar();
                
                // If active doc was inside, switch to safe default
                if (!projectData[0].content[activeDocId]) {
                    loadFirstAvailableDoc();
                }
            }
        }

        async function addItemToCategory(catIndex) {
            const label = await showCustomModal('prompt', 'إضافة صفحة جديدة', 'أدخل اسم الصفحة الجديدة:', 'صفحة جديدة');
            if (label) {
                const id = 'doc-' + Date.now();
                projectData[0].sidebar.items[catIndex].items.push({
                    type: "doc",
                    id: id,
                    label: label
                });
                // Initialize content
                projectData[0].content[id] = { id: id, title: label, body: `<h1>${label}</h1><p>ابدأ الكتابة هنا...</p>` };
                
                renderSidebar();
                loadDocContent(id);
            }
        }

        async function addNewItem() {
            // Adds to root
            const label = await showCustomModal('prompt', 'إضافة صفحة جديدة', 'أدخل اسم الصفحة الجديدة:', 'صفحة جديدة');
            if (label) {
                const id = 'doc-' + Date.now();
                projectData[0].sidebar.items.push({
                    type: "doc",
                    id: id,
                    label: label
                });
                projectData[0].content[id] = { id: id, title: label, body: `<h1>${label}</h1><p>ابدأ الكتابة هنا...</p>` };
                renderSidebar();
                loadDocContent(id);
            }
        }

        async function deleteItem(id) {
            const confirmed = await showCustomModal('confirm-delete', 'حذف الصفحة', 'هل أنت متأكد من حذف هذه الصفحة نهائياً؟');
            if (confirmed) {
                // Find and remove from sidebar structure
                const removeFromList = (list) => {
                    for (let i = 0; i < list.length; i++) {
                        if (list[i].id === id) {
                            list.splice(i, 1);
                            return true;
                        }
                        if (list[i].items) {
                            if (removeFromList(list[i].items)) return true;
                        }
                    }
                    return false;
                };

                removeFromList(projectData[0].sidebar.items);
                
                // Remove content
                if (projectData[0].content[id]) {
                    delete projectData[0].content[id];
                }

                renderSidebar();

                // Handle active state
                if (activeDocId === id) {
                    loadFirstAvailableDoc();
                }
            }
        }

        function loadFirstAvailableDoc() {
            // Find first available doc ID
            const findFirst = (list) => {
                for (let item of list) {
                    if (item.type === 'doc') return item.id;
                    if (item.items) {
                        const found = findFirst(item.items);
                        if (found) return found;
                    }
                }
                return null;
            };

            const firstId = findFirst(projectData[0].sidebar.items);
            if (firstId) {
                loadDocContent(firstId);
            } else {
                // No docs left
                document.getElementById('editor-container').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                activeDocId = null;
            }
        }

        // --- 6. Content Loading & Switching ---
        function loadDocContent(id) {
            if (!id) return;
            activeDocId = id;
            const contentData = projectData[0].content[id];

            document.getElementById('editor-container').classList.remove('hidden');
            document.getElementById('empty-state').classList.add('hidden');

            document.getElementById('page-label').value = getLabelFromSidebar(id) || contentData?.title || '';
            document.getElementById('page-id').value = id;

            const htmlContent = contentData ? (contentData.body || '') : '';
            
            if (tinymce.get('tinymce-editor')) tinymce.get('tinymce-editor').setContent(htmlContent);
            if (codeMirrorInstance) codeMirrorInstance.setValue(htmlContent);

            renderSidebar();
        }

        function getLabelFromSidebar(id) {
            const findLabel = (arr) => {
                for (let item of arr) {
                    if (item.id === id) return item.label;
                    if (item.items) {
                        const found = findLabel(item.items);
                        if(found) return found;
                    }
                }
                return null;
            };
            return findLabel(projectData[0].sidebar.items);
        }

        function switchTab(tab) {
            activeTab = tab;
            const visualBtn = document.getElementById('tab-visual');
            const codeBtn = document.getElementById('tab-code');
            const visualWrapper = document.getElementById('visual-editor-wrapper');
            const codeWrapper = document.getElementById('code-editor-wrapper');

            if (tab === 'visual') {
                const currentCode = codeMirrorInstance.getValue();
                tinymce.get('tinymce-editor').setContent(currentCode);
                visualBtn.className = "px-4 py-2 bg-white/10 rounded-t-lg text-sm border-t border-r border-l border-white/10 text-purple-300 font-bold";
                codeBtn.className = "px-4 py-2 hover:bg-white/5 rounded-t-lg text-sm text-gray-400 transition-colors";
                visualWrapper.classList.remove('hidden');
                codeWrapper.classList.add('hidden');
            } else {
                const currentHtml = tinymce.get('tinymce-editor').getContent();
                codeMirrorInstance.setValue(currentHtml);
                codeBtn.className = "px-4 py-2 bg-white/10 rounded-t-lg text-sm border-t border-r border-l border-white/10 text-purple-300 font-bold";
                visualBtn.className = "px-4 py-2 hover:bg-white/5 rounded-t-lg text-sm text-gray-400 transition-colors";
                visualWrapper.classList.add('hidden');
                codeWrapper.classList.remove('hidden');
                setTimeout(() => codeMirrorInstance.refresh(), 100);
            }
        }

        function saveCurrentPage() {
            if (!activeDocId) return;

            let content = activeTab === 'visual' ? tinymce.get('tinymce-editor').getContent() : codeMirrorInstance.getValue();
            if (activeTab === 'visual') codeMirrorInstance.setValue(content);
            else tinymce.get('tinymce-editor').setContent(content);

            const label = document.getElementById('page-label').value;

            if (!projectData[0].content[activeDocId]) {
                 projectData[0].content[activeDocId] = { id: activeDocId };
            }
            projectData[0].content[activeDocId].body = content;
            projectData[0].content[activeDocId].title = label;

            updateSidebarLabel(activeDocId, label);
            
            const btn = document.querySelector('button[onclick="saveCurrentPage()"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" size="16"></i> تم الحفظ!`;
            btn.classList.add('bg-green-500/20', 'text-green-300');
            lucide.createIcons();
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-green-500/20', 'text-green-300');
                lucide.createIcons();
                renderSidebar();
            }, 1500);
        }

        function updateSidebarLabel(id, newLabel) {
            const updateRec = (arr) => {
                for (let item of arr) {
                    if (item.id === id) { item.label = newLabel; return true; }
                    if (item.items && updateRec(item.items)) return true;
                }
                return false;
            };
            updateRec(projectData[0].sidebar.items);
        }

        function previewContent() {
            let currentContent = activeTab === 'visual' ? tinymce.get('tinymce-editor').getContent() : codeMirrorInstance.getValue();
            document.getElementById('preview-content-area').innerHTML = currentContent;
            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function closePreview() {
            document.getElementById('preview-modal').classList.add('hidden');
        }

        function downloadJson() {
            saveCurrentPage();
            const dataStr = JSON.stringify(projectData, null, 4);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'documentation_data.json');
            linkElement.click();
        }

    </script>
</body>
</html>
