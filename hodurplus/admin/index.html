// متغير عالمي (تأكد أنه موجود في بداية السكريبت مع المتغيرات)
let activeAttendanceRef = null;

function fetchAttendance(filterValue) {
    // 1. إغلاق الاتصال القديم لمنع التداخل
    if (activeAttendanceRef) {
        activeAttendanceRef.off();
    }
    
    // 2. عرض "جاري التحميل" فوراً ليعرف المستخدم أن شيئاً يحدث
    if (appState.currentSection === 'attendance') {
        const tableBody = document.querySelector('#attendance-table-container tbody');
        if (tableBody) {
             tableBody.innerHTML = '<tr><td colspan="5" class="p-10 text-center"><div class="loader mx-auto mb-4"></div><p class="text-slate-500">جاري التحديث...</p></td></tr>';
        }
    }

    // 3. تحديد المسار (يومي أو شامل)
    let path = `school/attendance/${filterValue}`;
    if (appState.filters.dateType !== 'day') {
        path = `school/attendance`;
    }

    // 4. فتح اتصال مباشر (Real-time)
    activeAttendanceRef = db.ref(path);
    activeAttendanceRef.on('value', (snapshot) => {
        // حفظ البيانات
        appState.attendance = snapshot.val() || {};
        
        // === الحل السحري هنا ===
        // نتحقق: هل المستخدم لا يزال فاتحاً لصفحة الحضور؟ إذا نعم، نحدث الشاشة
        if(appState.currentSection === 'attendance') {
            const newContent = renderAttendance();
            document.getElementById('content-area').innerHTML = newContent;
        }
    });
}
function goToToday() {
    const today = new Date().toISOString().split('T')[0];
    
    // تحديث الفلاتر للوضع الافتراضي
    appState.filters.dateValue = today;
    appState.filters.dateType = 'day';
    
    // استدعاء دالة التحديث (التي ستجلب البيانات وتحدث الشاشة)
    updateFilter('dateValue', today);
}

// Helper: Format Time with Seconds
        function formatTimeDisplay(timeStr) {
    if (!timeStr) return '-';

    // التحقق هل القيمة هي Timestamp (رقم طويل)؟
    // 1. إذا كانت رقماً أو نصاً يحتوي على أرقام فقط
    // 2. وطولها أكبر من 10 خانات
    if (!isNaN(timeStr) && String(timeStr).length > 10) {
        const date = new Date(Number(timeStr));
        return date.toLocaleTimeString('en-US', { 
            hour12: true, 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit' 
        });
    }

    // الكود القديم للتعامل مع النصوص العادية مثل "08:30:00"
    const str = String(timeStr);
    const parts = str.split(' ');
    
    if (parts.length > 1) return str; // التنسيق جاهز

    const timeOnly = parts[0]; 
    let [h, m, s] = timeOnly.split(':');

    if (!h || !m) return str;

    s = s || '00';
    const date = new Date();
    date.setHours(parseInt(h));
    date.setMinutes(parseInt(m));
    date.setSeconds(parseInt(s));
    
    return date.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
        // Helper: Calculate Status Logic (محدثة لدعم Timestamp وحساب الدقائق)
        function determineStatus(checkInTime, checkOutTime) {
            if (!checkInTime) return 'absent';
            if (checkOutTime) return 'checked-out';

            let checkInDate, limitDate;
            
            // التعامل مع Timestamp (رقم) أو نص (HH:mm:ss)
            if (!isNaN(checkInTime) && String(checkInTime).length > 10) {
                // إذا كان Timestamp
                const d = new Date(Number(checkInTime));
                const [h, m] = SCHOOL_START_TIME.split(':').map(Number);
                
                // مقارنة الساعات والدقائق فقط
                const checkInMinutes = d.getHours() * 60 + d.getMinutes();
                const limitMinutes = h * 60 + m;
                
                // هامش سماحية 5 دقائق
                return checkInMinutes > (limitMinutes + 5) ? 'late' : 'present';
            } else {
                // إذا كان نص عادي
                const timeStr = String(checkInTime);
                const timePart = timeStr.includes(' ') ? timeStr.split(' ')[0] : timeStr;
                checkInDate = new Date(`1970-01-01T${timePart}`);
                limitDate = new Date(`1970-01-01T${SCHOOL_START_TIME}`);
                return checkInDate > limitDate ? 'late' : 'present';
            }
        }

        // NEW: دالة لحساب وعرض ملاحظات التأخير بدقة مع أيقونات
        function getAttendanceNote(student) {
            if (student.status === 'late' && student.checkIn) {
                let diffMinutes = 0;
                const [startH, startM] = SCHOOL_START_TIME.split(':').map(Number);
                const startTotalMinutes = startH * 60 + startM;

                if (!isNaN(student.checkIn) && String(student.checkIn).length > 10) {
                    const d = new Date(Number(student.checkIn));
                    const currentTotalMinutes = d.getHours() * 60 + d.getMinutes();
                    diffMinutes = currentTotalMinutes - startTotalMinutes;
                } else {
                    const timeStr = String(student.checkIn).split(' ')[0];
                    const [h, m] = timeStr.split(':').map(Number);
                    const currentTotalMinutes = h * 60 + m;
                    diffMinutes = currentTotalMinutes - startTotalMinutes;
                }

                if (diffMinutes > 0) {
                    const h = Math.floor(diffMinutes / 60);
                    const m = diffMinutes % 60;
                    const timeString = h > 0 ? `${h} ساعة و ${m} د` : `${m} دقيقة`;
                    return `
                        <div class="flex items-center gap-1 text-red-600 bg-red-50 dark:bg-red-900/20 px-2 py-1 rounded-lg border border-red-100 dark:border-red-900/30 w-fit">

                            <span class="text-[10px] font-bold">تأخير ${timeString}</span>
                        </div>
                    `;
                }
            }
            if (student.status === 'present') return '<div class="flex items-center gap-1 text-green-600 bg-green-50 dark:bg-green-900/20 px-2 py-1 rounded-lg w-fit"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span class="text-[10px] font-bold">مثالي</span></div>';
            if (student.status === 'checked-out') return '<div class="flex items-center gap-1 text-blue-600 bg-blue-50 dark:bg-blue-900/20 px-2 py-1 rounded-lg w-fit"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg><span class="text-[10px] font-bold">منصرف</span></div>';
            return '<span class="text-slate-300 text-xs">-</span>';
        }

        css: `.id-card { width: 320px; height: 520px; background: #ffffff; border-radius: 20px; overflow: hidden; position: relative; font-family: 'Tajawal', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; }\n.watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-45deg); width: 300px; height: 300px; background: url('https://cdn-icons-png.flaticon.com/512/2997/2997235.png'); background-size: contain; opacity: 0.03; pointer-events: none; }\n.header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 20px; color: white; display: flex; align-items: center; gap: 15px; height: 110px; }\n.school-logo { width: 50px; height: 50px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }\n.school-info h1 { margin: 0; font-size: 16px; font-weight: 800; }\n.school-info p { margin: 2px 0 0; font-size: 10px; opacity: 0.7; letter-spacing: 1px; }\n.student-photo-container { margin-top: -40px; display: flex; flex-direction: column; align-items: center; position: relative; }\n.photo-border { width: 120px; height: 120px; border-radius: 50%; background: white; padding: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }\n.photo-border img, .photo-border div { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }\n.grade-badge { background: #f59e0b; color: white; padding: 4px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: -15px; z-index: 10; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }\n.content { padding: 10px 20px; text-align: center; }\n.student-name { margin: 15px 0 5px; color: #1e293b; font-size: 20px; font-weight: 900; }\n.info-grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px dashed #cbd5e1; }\n.info-item { display: flex; flex-direction: column; }\n.label { font-size: 10px; color: #64748b; margin-bottom: 2px; }\n.value { font-size: 14px; font-weight: bold; color: #334155; }\n.footer { position: absolute; bottom: 0; width: 100%; padding: 20px; display: flex; justify-content: space-between; align-items: flex-end; background: linear-gradient(to top, #ffffff, transparent); }\n.qr-container { width: 70px; height: 70px; background: white; padding: 5px; border-radius: 8px; border: 1px solid #e2e8f0; }\n.signature-area { text-align: center; display: flex; flex-direction: column; align-items: center; }\n.signature { width: 80px; height: auto; margin-bottom: 5px; opacity: 0.8; }`,
        js: `// منطق البطاقة الذكية\n\n// 1. تصغير الاسم إذا كان طويلاً جداً\nif (student.name.length > 25) {\n    const nameEl = cardElement.querySelector('.student-name');\n    if(nameEl) nameEl.style.fontSize = '16px';\n}\n\n// 2. تغيير لون الشارة بناءً على الصف\nconst badge = cardElement.querySelector('.grade-badge');\nif (badge) {\n    if (student.classId.includes('1')) badge.style.backgroundColor = '#ef4444'; // أحمر للأول\n    else if (student.classId.includes('2')) badge.style.backgroundColor = '#3b82f6'; // أزرق للثاني\n    else badge.style.backgroundColor = '#10b981'; // أخضر للبقية\n}`
    };

// دالة مساعدة لرسم زر القصاصة (Snippet Button)
function renderSnippetBtn(type, title, desc, code) {
    // Escape code for onclick attribute
    const escapedCode = code.replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
    const badgeColor = type === 'css' ? 'bg-blue-500/20 text-blue-400' : 'bg-yellow-500/20 text-yellow-400';
    
    return `
    <div class="lib-item group relative p-4 rounded-xl bg-[#252526] border border-white/5 hover:border-brand-500/50 hover:bg-[#2d2d30] transition overflow-hidden">
        <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${badgeColor} uppercase">${type}</span>
                <h4 class="font-bold text-slate-200 text-sm">${title}</h4>
            </div>
            <button onclick="insertSnippet('${type}', '${escapedCode}')" class="text-xs bg-brand-600 hover:bg-brand-500 text-white px-3 py-1.5 rounded-lg font-bold shadow-lg shadow-brand-500/20 opacity-0 group-hover:opacity-100 transition-all transform translate-x-2 group-hover:translate-x-0">
                إدراج
            </button>
        </div>
        <p class="text-xs text-slate-500 mb-3 leading-relaxed">${desc}</p>
        <div class="bg-black/40 rounded-lg p-2 overflow-x-auto">
            <pre class="text-[10px] text-slate-400 font-mono whitespace-pre scrollbar-hide">${code.substring(0, 60)}...</pre>
        </div>
    </div>
    `;
}

// 3. منطق البحث في المكتبة
function setupLibrarySearch() {
    const searchInput = document.getElementById('lib-search');
    if(!searchInput) return;

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const items = document.querySelectorAll('.lib-item');

        items.forEach(item => {
            const text = item.innerText.toLowerCase();
            if (text.includes(term)) {
                item.style.display = 'flex'; // أو block حسب العنصر، لكن flex للزر
                if (item.tagName === 'DIV') item.style.display = 'block'; 
                item.classList.remove('hidden');
            } else {
                item.style.display = 'none';
                item.classList.add('hidden');
            }
        });
        
        // إخفاء الأقسام الفارغة
        document.querySelectorAll('.lib-section').forEach(sec => {
            const visibleItems = sec.querySelectorAll('.lib-item:not(.hidden)').length;
            sec.style.display = visibleItems > 0 ? 'block' : 'none';
        });
    });
}

// التبديل بين التبويبات (تم التحديث لدعم تبويب المساعدة)
function switchEditorTab(tab) {
    // UI Update
    document.querySelectorAll('.cm-tab-btn').forEach(b => {
        b.classList.remove('active', 'border-b-2', 'border-blue-500', 'text-blue-400', 'bg-slate-800');
        b.classList.add('text-slate-400');
    });
    
    const activeBtn = document.getElementById(`tab-${tab}`);
    activeBtn.classList.add('active', 'border-b-2', 'border-blue-500', 'text-blue-400', 'bg-slate-800');
    activeBtn.classList.remove('text-slate-400');

    // Visibility Update
    ['html', 'css', 'js', 'help'].forEach(t => {
        const el = document.getElementById(`editor-container-${t}`);
        if(el) el.classList.add('hidden');
    });

    const target = document.getElementById(`editor-container-${tab}`);
    if(target) target.classList.remove('hidden');

    // Refresh CodeMirror if needed
    if (tab === 'html' && cmEditorHTML) cmEditorHTML.refresh();
    if (tab === 'css' && cmEditorCSS) cmEditorCSS.refresh();
    if (tab === 'js' && cmEditorJS) cmEditorJS.refresh();
}
// دالة إدراج التاج في محرر HTML
function insertTag(tag) {
    if (!cmEditorHTML) return;
    const doc = cmEditorHTML.getDoc();
    const cursor = doc.getCursor();
    doc.replaceRange(tag, cursor);
    
    // الانتقال لتبويب HTML تلقائياً لرؤية التعديل
    switchEditorTab('html');
    cmEditorHTML.focus();
    showToast('تم إدراج المتغير بنجاح');
}
// تحديث بسيط لدالة insertSnippet لدعم toast أفضل
function insertSnippet(type, code) {
    let editor;
    if (type === 'css') editor = cmEditorCSS;
    else if (type === 'js') editor = cmEditorJS;
    else editor = cmEditorHTML;

    if (editor) {
        const doc = editor.getDoc();
        const cursor = doc.getCursor();
        const codeToInsert = `\n/* Snippet: ${type.toUpperCase()} */\n${code}\n`;
        doc.replaceRange(codeToInsert, cursor);
        
        switchEditorTab(type);
        editor.focus();
        showToast(`تم إدراج كود ${type.toUpperCase()} بنجاح`, 'success');
    }
}

        // ==========================================
        // 5. Logic: QR Scanner & Attendance (NEW CORE)
        // ==========================================
        let html5QrcodeScanner = null;
        let currentScanMode = 'in'; // 'in' or 'out'
        let isScanning = false;

        function openScanner() {
            document.body.classList.add('scanner-active');
            
            if(!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }

            // تفعيل الكاميرا
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => {
                alert("فشل في تشغيل الكاميرا. تأكد من السماح بالوصول للكاميرا.");
                closeScanner();
            });

            setScanMode('in'); // Default to Check-in
        }

        function closeScanner() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.body.classList.remove('scanner-active');
                }).catch(err => console.log(err));
            } else {
                 document.body.classList.remove('scanner-active');
            }
        }

        function setScanMode(mode) {
            currentScanMode = mode;
            const btnIn = document.getElementById('btn-scan-in');
            const btnOut = document.getElementById('btn-scan-out');
            
            // UI Toggle
            if(mode === 'in') {
                btnIn.classList.add('bg-green-500', 'shadow-[0_0_20px_rgba(34,197,94,0.4)]', 'scale-105');
                btnIn.classList.remove('hover:bg-white/10');
                btnOut.classList.remove('bg-red-500', 'shadow-[0_0_20px_rgba(239,68,68,0.4)]', 'scale-105');
                btnOut.classList.add('hover:bg-white/10');
            } else {
                btnOut.classList.add('bg-red-500', 'shadow-[0_0_20px_rgba(239,68,68,0.4)]', 'scale-105');
                btnOut.classList.remove('hover:bg-white/10');
                btnIn.classList.remove('bg-green-500', 'shadow-[0_0_20px_rgba(34,197,94,0.4)]', 'scale-105');
                btnIn.classList.add('hover:bg-white/10');
            }
        }

        function playSound(type) {
            const audio = document.getElementById(type === 'success' ? 'sound-success' : 'sound-error');
            if(audio) {
                audio.currentTime = 0;
                audio.play();
            }
        }

        function showScannerStatus(msg, type = 'neutral') {
            const el = document.getElementById('scanner-status');
            el.innerText = msg;
            el.style.opacity = '1';
            el.className = `mt-4 px-6 py-2 rounded-full backdrop-blur text-white text-sm font-bold transition-opacity ${
                type === 'success' ? 'bg-green-500/80' : 
                type === 'error' ? 'bg-red-500/80' : 'bg-black/60'
            }`;
            
            setTimeout(() => { el.style.opacity = '0'; }, 3000);
        }

        // Logic: عند قراءة QR Code
        function onScanSuccess(decodedText, decodedResult) {
            if (isScanning) return; // منع التكرار السريع
            isScanning = true;

            try {
                // 1. تحليل البيانات
                const data = JSON.parse(decodedText);
                if (!data.id || data.type !== 'student') throw new Error("QR Code غير صالح");

                // 2. البحث عن الطالب في البيانات المحلية (للسرعة)
                // data.id هو studentId (مثل 2024001)، نحتاج البحث عن الـ Key (مثل s1)
                const studentKey = Object.keys(appState.students).find(key => appState.students[key].studentId === data.id);
                
                if(!studentKey) throw new Error("الطالب غير مسجل في النظام");
                
                const student = appState.students[studentKey];
                const date = getTodayDate();
                
                // NEW: تنسيق الوقت الدقيق مع الثواني (HH:mm:ss)
                const now = new Date();
                const time = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                const attendanceRef = db.ref(`school/attendance/${date}/${studentKey}`);

                // 3. التحقق من الحالة في Firebase قبل التسجيل
                attendanceRef.get().then((snapshot) => {
                    const record = snapshot.val();

                    if (currentScanMode === 'in') {
                        if (record && record.checkInTime) {
                            throw new Error(`تم تسجيل حضور ${student.name} مسبقاً في ${record.checkInTime}`);
                        }
                        
                        // NEW: حساب الحالة (متأخر أم حاضر)
                        let status = 'present';
                        const checkInDate = new Date(`1970-01-01T${time}`);
                        const limitDate = new Date(`1970-01-01T${SCHOOL_START_TIME}`);
                        if (checkInDate > limitDate) status = 'late';

                        // تسجيل الحضور
                        return attendanceRef.set({
                            studentId: student.studentId,
                            name: student.name,
                            classId: student.classId,
                            checkInTime: time,
                            status: status, 
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        });
                    } else {
                        // تسجيل الانصراف
                        if (!record || !record.checkInTime) {
                            throw new Error(`عفواً، ${student.name} لم يسجل حضور اليوم!`);
                        }
                        if (record.checkOutTime) {
                            throw new Error(`تم تسجيل انصراف ${student.name} مسبقاً`);
                        }

                        return attendanceRef.update({
                            checkOutTime: time,
                            status: 'checked-out',
                            lastUpdated: firebase.database.ServerValue.TIMESTAMP
                        });
                    }
                }).then(() => {
                    playSound('success');
                    showScannerStatus(
                        currentScanMode === 'in' ? `تم حضور: ${student.name}` : `تم انصراف: ${student.name}`, 
                        'success'
                    );
                }).catch((error) => {
                    playSound('error');
                    showScannerStatus(error.message, 'error');
                }).finally(() => {
                    // فترة راحة قبل السماح بمسح جديد (1.5 ثانية)
                    setTimeout(() => { isScanning = false; }, 1500);
                });

            } catch (e) {
                playSound('error');
                showScannerStatus(e.message || "رمز غير صالح", 'error');
                setTimeout(() => { isScanning = false; }, 1500);
            }
        }

        function handleFormSubmit(e, type) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader w-4 h-4 border-2 border-white border-t-transparent inline-block mr-2"></span> جاري الحفظ...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            if(type === 'addClass') {
                data.teachers = Array.from(e.target.querySelectorAll('input[name="teachers"]:checked')).map(cb => cb.value);
            }

            const refName = 
                type === 'addClass' ? 'classes' : 
                type === 'addTeacher' ? 'teachers' : 
                type === 'addStudent' ? 'students' : 
                type === 'addClassroom' ? 'classrooms' :
                type === 'addLesson' ? 'lessons' : null;

            if (refName) {
                db.ref(`school/${refName}`).push(data).then(() => {
                    closeModal();
                    showToast('تمت الإضافة بنجاح', 'success');
                    if(type === 'addLesson') selectClassForLessons(data.classId);
                }).catch(err => {
                    showToast('حدث خطأ أثناء الحفظ', 'error');
                    btn.disabled = false;
                    btn.innerText = 'إعادة المحاولة';
                });
            }
        }

        function handleUpdate(e, section) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader w-4 h-4 border-2 border-white border-t-transparent inline-block mr-2"></span> جاري التحديث...';

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            if(section === 'classes') {
                data.teachers = Array.from(e.target.querySelectorAll('input[name="teachers"]:checked')).map(cb => cb.value);
            }

            db.ref(`school/${section}/${currentEditId}`).update(data).then(() => {
                closeModal();
                showToast('تم تحديث البيانات بنجاح', 'success');
                if(section === 'lessons' && currentSelectedClassId) selectClassForLessons(currentSelectedClassId);
            }).catch(err => {
                showToast('فشل التحديث', 'error');
                btn.disabled = false;
                btn.innerText = 'حفظ التعديلات';
            });
        }

        function requestDelete(section, id) {
            currentDeleteTarget = { section, id };
            const container = document.getElementById('modal-container');
            const body = document.getElementById('modal-content-body');
            const content = document.querySelector('.modal-content');

            container.classList.remove('hidden');
            requestAnimationFrame(() => {

                content.classList.add('scale-100', 'opacity-100');

        function confirmDeleteAction() {
            if(!currentDeleteTarget) return;
            const { section, id } = currentDeleteTarget;
            const path = id === 'all' ? `school/${section}` : `school/${section}/${id}`;
            
            db.ref(path).remove().then(() => {
                closeModal();
                showToast('تم الحذف بنجاح', 'success');
                if(section === 'lessons' && currentSelectedClassId) selectClassForLessons(currentSelectedClassId);
            }).catch(err => {
                showToast('فشل عملية الحذف', 'error');
                closeModal();
            });

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' 
                ? '<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
                : '<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';

            toast.innerHTML = `
                <div class="p-2 bg-slate-100 dark:bg-slate-700 rounded-full">${icon}</div>
                <div class="flex-1">
                    <p class="font-bold text-sm text-slate-800 dark:text-white">${type === 'success' ? 'نجحت العملية' : 'حدث خطأ'}</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400">${message}</p>
                </div>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

// دالة الطباعة المحدثة (تدعم تنفيذ كود JS لكل بطاقة)
function printIDs(ids) {
    const printArea = document.getElementById('print-area');
    printArea.innerHTML = ''; 

    // البحث عن القالب الافتراضي
    let template = Object.values(appState.templates).find(t => t.isDefault);
    
    // Fallback template
    if (!template) {
        template = {
            css: `.id-card { width: 320px; height: 500px; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; background: white; font-family: 'Tajawal'; position: relative; -webkit-print-color-adjust: exact; margin: 10px auto; } .id-header { height: 140px; background: linear-gradient(135deg, #0284c7 0%, #0891b2 100%); display: flex; justify-content: center; padding-top: 20px; color: white; text-align: center; } .id-photo { width: 100px; height: 100px; background: #f1f5f9; border-radius: 50%; border: 4px solid white; position: absolute; top: 90px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; font-size: 40px; color: #64748b; font-weight: bold; } .id-body { margin-top: 60px; text-align: center; padding: 0 20px; } .id-qr { margin-top: 20px; display: flex; justify-content: center; }`,
            html: `<div class="id-card"><div class="id-header"><div><h2 style="margin:0; font-size:18px;">MODERN SCHOOL</h2><p style="margin:0; font-size:12px; opacity:0.9;">IDENTITY CARD</p></div></div><div class="id-photo">{{student_photo}}</div><div class="id-body"><h2 style="margin:0; font-size:22px; font-weight:800; color:#1e293b">{{student_name}}</h2><p style="margin:5px 0 15px; color:#0284c7; font-weight:bold; background:#e0f2fe; display:inline-block; padding:4px 12px; border-radius:20px; font-size:14px;">{{student_class}}</p><div style="font-family:monospace; color:#64748b;">ID: {{student_id}}</div><div class="id-qr">{{qr_code}}</div></div></div>`,
            js: ''
        };
    }

    // إضافة الستايل
    const styleTag = document.createElement('style');
    styleTag.innerHTML = `@media print { ${template.css} .id-card-print-wrapper { page-break-inside: avoid; display: inline-block; margin: 10px; } }`;
    printArea.appendChild(styleTag);

    // بناء البطاقات
    ids.forEach(id => {
        const student = appState.students[id];
        const className = appState.classes[student.classId]?.name || '';
        const qrData = JSON.stringify({ id: student.studentId, type: "student" });

        let cardHtml = template.html
            .replace(/{{student_name}}/g, student.name)
            .replace(/{{student_class}}/g, className)
            .replace(/{{student_id}}/g, student.studentId)
            .replace(/{{student_photo}}/g, `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2em;font-weight:bold;color:#ccc;background:#f1f5f9;border-radius:50%">${student.name.charAt(0)}</div>`)
            .replace(/{{qr_code}}/g, `<div class="qr-target" data-qr="${encodeURIComponent(qrData)}"></div>`)
            .replace(/{{date}}/g, new Date().toLocaleDateString('ar-EG'));

        const wrapper = document.createElement('div');
        wrapper.className = 'id-card-print-wrapper';
        wrapper.innerHTML = cardHtml;
        printArea.appendChild(wrapper);

        // تنفيذ الـ Custom JS لكل بطاقة
        if (template.js) {
            try {
                const cardEl = wrapper.firstElementChild; // نفترض أن العنصر الأول هو البطاقة
                const safeRun = new Function('cardElement', 'student', template.js);
                safeRun(cardEl, student); // نمرر بيانات الطالب أيضاً للكود
            } catch (e) { console.error("Error in card JS:", e); }
        }
    });

    // توليد الـ QR
    document.querySelectorAll('#print-area .qr-target').forEach(el => {
        new QRCode(el, {
            text: decodeURIComponent(el.getAttribute('data-qr')),
            width: 100, height: 100,
            colorDark : "#000000", colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    });

    setTimeout(() => window.print(), 1000); // زيادة الوقت قليلاً لضمان التنفيذ
}

                                <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                                <p>ادخل الوصف واضغط توليد لبدء السحر</p>
                             </div>
                        </div>
                    </div>
                    <div id="ai-view-html" class="absolute inset-0 hidden bg-[#282a36]"><textarea id="ai-code-html"></textarea></div>
                    <div id="ai-view-css" class="absolute inset-0 hidden bg-[#282a36]"><textarea id="ai-code-css"></textarea></div>
                    <div id="ai-view-js" class="absolute inset-0 hidden bg-[#282a36]"><textarea id="ai-code-js"></textarea></div>
                </div>
            </div>
        </div>
    `;

    // تهيئة CodeMirror بعد الرسم
    setTimeout(() => {
        const config = { theme: 'dracula', lineNumbers: true, lineWrapping: true };
        aiEditorInstances.html = CodeMirror.fromTextArea(document.getElementById('ai-code-html'), { ...config, mode: 'xml', htmlMode: true });
        aiEditorInstances.css = CodeMirror.fromTextArea(document.getElementById('ai-code-css'), { ...config, mode: 'css' });
        aiEditorInstances.js = CodeMirror.fromTextArea(document.getElementById('ai-code-js'), { ...config, mode: 'javascript' });
        
        // تحديث المعاينة عند التعديل اليدوي في نافذة AI
        [aiEditorInstances.html, aiEditorInstances.css, aiEditorInstances.js].forEach(ed => {
            ed.on('change', () => {
                // حفظ التغييرات في المتغير المؤقت
                currentGeneratedCode.html = aiEditorInstances.html.getValue();
                currentGeneratedCode.css = aiEditorInstances.css.getValue();
                currentGeneratedCode.js = aiEditorInstances.js.getValue();
                renderAIPreview(); // تحديث المعاينة
            });
        });
    }, 100);
}

function closeAIStudio() {
    const aiContainer = document.getElementById('ai-modal-container');
    const content = document.getElementById('ai-modal-content');
    
    gsap.to(content, { scale: 0.9, opacity: 0, duration: 0.3, onComplete: () => {
        aiContainer.classList.add('hidden');
    }});
}

function setAIPrompt(text) {
    document.getElementById('ai-prompt').value = text;
}

function switchAITab(tab) {
    // UI Update
    document.querySelectorAll('.ai-tab-btn').forEach(b => {
        b.className = 'ai-tab-btn px-4 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition';
    });
    document.getElementById(`ai-tab-${tab}`).className = 'ai-tab-btn px-4 py-1.5 rounded-lg text-xs font-bold text-white bg-purple-600/20 border border-purple-500/50';

    // Visibility
    ['preview', 'html', 'css', 'js'].forEach(t => {
        document.getElementById(`ai-view-${t}`).classList.add('hidden');
    });
    document.getElementById(`ai-view-${tab}`).classList.remove('hidden');

    // Refresh Editors
    if (tab !== 'preview') {
        setTimeout(() => aiEditorInstances[tab].refresh(), 10);
    }
}

async function generateTemplateWithAI() {
    const prompt = document.getElementById('ai-prompt').value;
    if (!prompt) return showToast('يرجى كتابة وصف للتصميم أولاً', 'error');

    const loader = document.getElementById('ai-loader');
    const loaderText = document.getElementById('ai-loader-text');
    loader.classList.remove('hidden');
    loader.style.display = 'flex';

    // اختيار مفتاح عشوائي
    const apiKey = GEMINI_KEYS[Math.floor(Math.random() * GEMINI_KEYS.length)];
    
    // إعداد الـ Prompt للذكاء الاصطناعي
    const systemInstruction = `
    You are an expert Frontend Developer and UI/UX Designer specialized in creating Student ID Cards using HTML, CSS, and minimal JS.
    
    **Goal:** Create a stunning, modern, and professional Student ID Card template based on the user's description.
    
    **Constraints & Requirements:**
    1. **Output Format:** Return ONLY a valid JSON object without markdown code blocks. The JSON must have keys: "html", "css", "js".
    2. **HTML Structure:** Root element should not have a fixed ID, use classes. Use these placeholders strictly: {{student_name}}, {{student_class}}, {{student_id}}, {{student_photo}}, {{qr_code}}, {{academic_year}}.
    3. **CSS:** - Make the card wrapper class named '.ai-id-card'. 
       - Use 'Tajawal' font. 
       - Ensure dimensions are approximately width: 320px, height: 500px (portrait).
       - Use absolute positioning for layout flexibility.
       - Add cool effects like gradients, box-shadows, border-radius.
    4. **JS:** Write minimal JS to manipulate the element if needed (e.g., dynamic coloring based on class). The JS will receive a variable 'cardElement' representing the root DOM element and 'student' object.
    
    **User Description:** ${prompt}
    `;

    try {
        loaderText.innerText = "جاري الاتصال بـ Gemini...";
        
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: systemInstruction }] }]
            })
        });

        if (!response.ok) throw new Error('فشل الاتصال بـ AI');

        const data = await response.json();
        loaderText.innerText = "جاري معالجة الكود...";

        let generatedText = data.candidates[0].content.parts[0].text;
        
        // تنظيف النص من علامات الـ Markdown إذا وجدت
        generatedText = generatedText.replace(/```json/g, '').replace(/```/g, '').trim();
        
        const codeObj = JSON.parse(generatedText);

        // تحديث المحرر والبيانات
        currentGeneratedCode = codeObj;
        aiEditorInstances.html.setValue(codeObj.html);
        aiEditorInstances.css.setValue(codeObj.css);
        aiEditorInstances.js.setValue(codeObj.js || '');

        renderAIPreview();
        switchAITab('preview');
        showToast('تم تصميم القالب بنجاح!', 'success');

    } catch (error) {
        console.error(error);
        showToast('حدث خطأ أثناء التوليد: ' + error.message, 'error');
    } finally {
        loader.classList.add('hidden');
    }
}

function renderAIPreview() {
    const { html, css, js } = currentGeneratedCode;
    
    const previewHtml = html
        .replace(/{{student_name}}/g, 'أحمد محمد علي')
        .replace(/{{student_class}}/g, 'الأول الثانوي')
        .replace(/{{student_id}}/g, '2024001')
        .replace(/{{academic_year}}/g, '2024/2025')
        .replace(/{{student_photo}}/g, '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#e2e8f0;color:#64748b;font-weight:bold;font-size:24px;">img</div>')
        .replace(/{{qr_code}}/g, '<div style="width:80px;height:80px;background:#000;margin:0 auto;opacity:0.8"></div>');

    const container = document.getElementById('ai-preview-container');
    if (!container.shadowRoot) container.attachShadow({mode: 'open'});
    
    container.shadowRoot.innerHTML = `
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');
            body { font-family: 'Tajawal', sans-serif; margin: 0; background: transparent; display:flex; justify-content:center; padding: 20px; }
            * { box-sizing: border-box; }
            ${css}
        </style>
        <div id="ai-card-wrapper">${previewHtml}</div>
    `;

    // تنفيذ JS
    try {
        const cardElement = container.shadowRoot.getElementById('ai-card-wrapper').firstElementChild;
        if(js && cardElement) {
            // محاكاة كائن الطالب
            const studentMock = { name: 'أحمد محمد', classId: 'G10', studentId: '2024001' };
            const safeRun = new Function('cardElement', 'student', js);
            safeRun(cardElement, studentMock);
        }
    } catch(e) { console.warn("AI JS Error:", e); }
}

function importAICode() {
    if (!currentGeneratedCode.html) return showToast('لا يوجد تصميم لاستيراده', 'error');

    // إذا كان المحرر الرئيسي مفتوحاً، نضع القيم فيه
    if (cmEditorHTML && cmEditorCSS && cmEditorJS) {
        cmEditorHTML.setValue(currentGeneratedCode.html);
        cmEditorCSS.setValue(currentGeneratedCode.css);
        cmEditorJS.setValue(currentGeneratedCode.js || '');
        
        // إغلاق نافذة الـ AI
        closeAIStudio();
        
        // فتح تبويب المعاينة في المحرر الرئيسي لتأكيد الاستيراد
        updateLivePreview();
        showToast('تم استيراد التصميم إلى المحرر بنجاح', 'success');
    } else {
        // حالة نادرة: فتح المحرر الرئيسي ثم وضع القيم
        openTemplateEditor();
        setTimeout(() => {
            cmEditorHTML.setValue(currentGeneratedCode.html);
            cmEditorCSS.setValue(currentGeneratedCode.css);
            cmEditorJS.setValue(currentGeneratedCode.js || '');
            closeAIStudio();
        }, 500);
    }
}
