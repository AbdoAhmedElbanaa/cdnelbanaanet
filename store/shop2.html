<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Ultimate Luxury Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        .sidebar-scroll::-webkit-scrollbar { width: 5px; }
        .sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 20px; }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover { background-color: #cbd5e1; }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: #4f46e5; cursor: pointer; margin-top: -8px;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2); transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px; cursor: pointer;
            background: linear-gradient(to right, #4f46e5 0%, #cbd5e1 100%); border-radius: 4px;
        }

        .visual-checkbox {
            appearance: none; width: 20px; height: 20px; border: 2px solid #cbd5e1;
            border-radius: 6px; position: relative; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .visual-checkbox:checked { background-color: #4f46e5; border-color: #4f46e5; transform: scale(1.1); }
        .visual-checkbox:checked::after {
            content: '✓'; position: absolute; color: white; font-size: 12px;
            top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold;
        }

        .filter-row:hover .count-badge { background-color: #4f46e5; color: white; transform: scale(1.1); }
        .filter-row:hover .cat-icon-visual { transform: rotate(15deg) scale(1.2); color: #4f46e5; }

        /* Search Input Animation */
        .search-expand-enter-active, .search-expand-leave-active { transition: all 0.3s ease-out; max-height: 50px; opacity: 1; }
        .search-expand-enter-start, .search-expand-leave-end { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; margin: 0; overflow: hidden; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#3b82f6', secondary: '#0f172a', accent: '#f59e0b' }
                }
            }
        }
    </script>
</head>

<body class="relative min-h-screen text-slate-800 font-sans antialiased" x-data="shopApp()">

    <header class="relative z-50 pt-2 pb-6 px-4" x-data="{ mobileMenu: false, megaMenu: false, cartOpen: false, userMenu: false, langMenu: false }">
        <div class="container mx-auto max-w-[1350px] mb-3">
            <div class="flex justify-between items-center text-xs font-medium text-slate-500">
                <div class="flex items-center gap-4">
                    <a href="tel:000000000" class="flex items-center gap-1.5 hover:text-primary transition"><span>000000000</span></a>
                    <span class="hidden sm:inline w-px h-3 bg-slate-300"></span>
                    <a href="tel:000000000" class="hidden sm:flex items-center gap-1.5 hover:text-primary transition"><span>Hotline</span></a>
                </div>
                <div class="flex items-center gap-4 relative">
                    <div class="relative" @click.outside="langMenu = false">
                        <button @click="langMenu = !langMenu" class="flex items-center gap-1.5 hover:text-primary transition cursor-pointer">
                            <img src="https://sell77.doobagency.com/public/assets/front-end/img/flags/en.png" class="w-4 h-4 rounded-full shadow-sm" alt="Lang">
                            <span>English</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-2xl shadow-glass container mx-auto max-w-[1350px] sticky top-4 transition-all duration-300 z-50">
            <div class="px-4 py-3 md:px-6 flex items-center justify-between gap-6 border-b border-slate-100/50">
                <a href="index.html" class="flex items-center gap-2.5 group shrink-0">
                    <div class="w-11 h-11 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/20 group-hover:scale-105 transition-transform duration-300">
                        <span class="font-extrabold text-lg">B</span>
                    </div>
                    <div class="hidden md:block">
                        <h1 class="font-bold text-xl tracking-tight text-slate-800 leading-none group-hover:text-primary transition-colors">Brandoz</h1>
                        <p class="text-[10px] text-slate-400 font-medium tracking-widest uppercase">Store</p>
                    </div>
                </a>

                <div class="hidden lg:flex flex-1 max-w-xl relative group">
                    <form class="relative w-full flex items-center bg-slate-100/50 border border-slate-200 rounded-full focus-within:bg-white focus-within:border-primary/50 focus-within:ring-4 focus-within:ring-primary/10 transition-all duration-300">
                        <input type="text" placeholder="Search for items..." class="w-full bg-transparent py-3 ps-6 pe-12 text-sm outline-none text-slate-700 placeholder:text-slate-400">
                        <button type="button" class="absolute end-1.5 top-1.5 bottom-1.5 w-9 h-9 bg-white text-primary rounded-full shadow-sm flex items-center justify-center hover:bg-primary hover:text-white transition-all duration-300">
                            <svg class="w-4 h-4 rtl:scale-x-[-1]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        </button>
                    </form>
                </div>

                <div class="flex items-center gap-3 md:gap-5">
                    <div class="relative hidden md:block" @click.outside="userMenu = false">
                        <button @click="userMenu = !userMenu" class="flex items-center gap-3 group">
                            <div class="text-end hidden xl:block">
                                <p class="text-[10px] text-slate-400 font-bold uppercase">Hello, UIUX</p>
                                <p class="text-xs font-bold text-slate-700 group-hover:text-primary transition">Dashboard</p>
                            </div>
                            <div class="w-10 h-10 rounded-full border-2 border-white shadow-md overflow-hidden group-hover:ring-2 ring-primary/20 transition-all">
                                <img src="https://sell77.doobagency.com/public/assets/front-end/img/placeholder/user.png" class="w-full h-full object-cover">
                            </div>
                        </button>
                    </div>
                    <span class="w-px h-8 bg-slate-200 hidden md:block"></span>
                    <div class="relative" @click.outside="cartOpen = false">
                        <button @click="cartOpen = !cartOpen" class="flex items-center gap-3 p-1 pe-3 rounded-full hover:bg-slate-100 transition-all group border border-transparent hover:border-slate-200">
                            <div class="relative w-10 h-10 bg-slate-100 text-slate-600 rounded-full flex items-center justify-center group-hover:bg-primary group-hover:text-white transition-colors shadow-sm">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
                                <span class="absolute -top-1 -end-1 w-4 h-4 bg-accent text-white text-[9px] font-bold rounded-full flex items-center justify-center ring-2 ring-white">2</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-4 md:px-6 py-2 flex items-center justify-between gap-4">
                <button class="flex items-center gap-2 px-5 py-2.5 bg-slate-900 text-white rounded-xl hover:bg-slate-800 transition-colors shadow-lg shadow-slate-900/20 group">
                    <svg class="w-5 h-5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" /></svg>
                    <span class="font-bold text-sm">Categories</span>
                </button>
                <nav class="hidden lg:flex items-center gap-1 overflow-x-auto hide-scrollbar flex-1 px-4">
                    <a href="index.html" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-primary rounded-lg hover:bg-slate-50 transition">Home</a>
                    <a href="#" class="relative px-6 py-2 text-sm font-bold text-white rounded-xl shadow-lg shadow-indigo-500/30 group overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-indigo-600 via-purple-600 to-indigo-600 animate-[gradient_3s_ease_infinite] bg-[length:200%_200%]"></div>
                        <span class="relative flex items-center gap-2">Shop</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mx-auto max-w-[1400px] px-4 md:px-6 py-6 pb-20">

        <section class="mb-8 relative z-20" data-aos="fade-down">
            <div class="glass-panel rounded-3xl p-6 relative overflow-hidden group">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-full blur-3xl opacity-50 group-hover:scale-125 transition-transform duration-1000"></div>
                <div class="flex flex-col lg:flex-row items-center justify-between gap-6 relative z-10">
                    <div class="flex items-center gap-5 w-full lg:w-auto">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-50 to-white border border-indigo-100 flex items-center justify-center shadow-sm text-indigo-600 relative">
                            <svg class="w-8 h-8 relative z-10 animate-[spin_10s_linear_infinite]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                        </div>
                        <div>
                            <h2 class="text-3xl font-black text-slate-800 tracking-tight">Products <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">(OTO Speedios)</span></h2>
                            <p class="text-sm font-bold text-slate-500 flex items-center gap-2 mt-1">
                                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> <span x-text="filteredCount">12</span> Items found
                            </p>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-4 w-full lg:w-auto justify-end">
                        <div class="relative w-full sm:w-64" x-data="{ open: false }" @click.outside="open = false">
                             <button @click="open = !open" class="w-full flex items-center justify-between px-4 py-3 bg-white border border-slate-200 rounded-xl shadow-sm hover:border-indigo-400 transition-all">
                                <span class="text-sm font-bold text-slate-700" x-text="currentSort">Latest</span>
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                            </button>
                            <div x-show="open" class="absolute top-full right-0 w-full mt-2 bg-white rounded-xl shadow-xl z-50 overflow-hidden" style="display: none;">
                                <template x-for="sort in sortOptions"><a href="#" @click.prevent="currentSort = sort; open = false" class="block px-4 py-2 hover:bg-slate-50 text-sm" x-text="sort"></a></template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

            <aside class="lg:col-span-1 space-y-8" id="sidebar-filters">
                <div class="glass-panel rounded-3xl p-5 sticky top-24 max-h-[calc(100vh-100px)] overflow-y-auto sidebar-scroll">
                    
                    <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-100">
                        <h3 class="font-black text-xl text-slate-800 flex items-center gap-2">Filter</h3>
                        <button class="text-[10px] font-bold uppercase text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-full transition">Reset All</button>
                    </div>

                    <div class="filter-section mb-8">
                        <h4 class="font-bold text-sm text-slate-800 mb-4 flex items-center gap-2"><span class="w-1 h-4 bg-indigo-500 rounded-full"></span> Choose</h4>
                        <div class="space-y-3">
                            <label class="filter-row flex items-center gap-3 cursor-pointer p-2 rounded-xl hover:bg-white hover:shadow-sm transition-all group">
                                <input type="checkbox" class="visual-checkbox">
                                <span class="text-sm font-medium text-slate-600 group-hover:text-indigo-600 transition">Best Selling</span>
                            </label>
                            <label class="filter-row flex items-center gap-3 cursor-pointer p-2 rounded-xl hover:bg-white hover:shadow-sm transition-all group">
                                <input type="checkbox" class="visual-checkbox">
                                <span class="text-sm font-medium text-slate-600 group-hover:text-indigo-600 transition">Top Rated</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section mb-8">
                        <h4 class="font-bold text-sm text-slate-800 mb-4">Price</h4>
                        <input type="range" min="0" max="10000" class="w-full">
                        <div class="flex gap-2 mt-2"><input type="number" placeholder="0" class="w-full py-2 px-3 rounded-lg border text-xs"><input type="number" placeholder="Max" class="w-full py-2 px-3 rounded-lg border text-xs"></div>
                    </div>

                    <div class="filter-section mb-8 border-t border-slate-100 pt-6" x-data="{ open: true, searchOpen: false }">
                        <div class="flex items-center justify-between mb-4">
                            <button @click="open = !open" class="flex items-center gap-2 font-bold text-sm text-slate-800 hover:text-indigo-600 transition group">
                                <span class="w-1 h-4 bg-indigo-500 rounded-full group-hover:h-5 transition-all"></span> Categories
                            </button>
                            <div class="flex items-center gap-2">
                                <button @click="searchOpen = !searchOpen" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-indigo-50 text-slate-400 hover:text-indigo-600 transition" :class="searchOpen ? 'bg-indigo-50 text-indigo-600' : ''">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                </button>
                                <button @click="open = !open" class="text-slate-400 hover:text-indigo-600 transition">
                                    <svg class="w-4 h-4 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                            </div>
                        </div>

                        <div x-show="searchOpen" x-collapse class="mb-3 overflow-hidden">
                            <div class="relative group">
                                <input type="text" placeholder="Search categories..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all">
                                <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            </div>
                        </div>

                        <ul x-show="open" x-collapse class="space-y-1 pr-1">
                            <template x-for="cat in categories">
                                <li class="filter-row flex items-center justify-between group/item cursor-pointer p-2 rounded-lg hover:bg-white hover:shadow-sm transition-all">
                                    <span class="text-sm text-slate-600 font-medium group-hover/item:text-indigo-600 transition flex items-center gap-2.5">
                                        <svg class="cat-icon-visual w-4 h-4 text-slate-400 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                                        <span x-text="cat"></span>
                                    </span>
                                </li>
                            </template>
                        </ul>
                    </div>

                    <div class="filter-section mb-8 border-t border-slate-100 pt-6" x-data="{ open: true, searchOpen: false }">
                        <div class="flex items-center justify-between mb-4">
                            <button @click="open = !open" class="flex items-center gap-2 font-bold text-sm text-slate-800 hover:text-indigo-600 transition group">
                                <span class="w-1 h-4 bg-indigo-500 rounded-full group-hover:h-5 transition-all"></span> Brands
                            </button>
                            <div class="flex items-center gap-2">
                                <button @click="searchOpen = !searchOpen" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-indigo-50 text-slate-400 hover:text-indigo-600 transition" :class="searchOpen ? 'bg-indigo-50 text-indigo-600' : ''">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                </button>
                                <button @click="open = !open" class="text-slate-400 hover:text-indigo-600 transition">
                                    <svg class="w-4 h-4 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                            </div>
                        </div>

                        <div x-show="searchOpen" x-collapse class="mb-3 overflow-hidden">
                            <div class="relative group">
                                <input type="text" placeholder="Search brands..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all">
                                <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            </div>
                        </div>

                        <ul x-show="open" x-collapse class="space-y-1 pr-1">
                            <template x-for="brand in brands">
                                <li class="filter-row flex items-center justify-between group/item cursor-pointer p-2 rounded-xl hover:bg-slate-50 border border-transparent hover:border-slate-100 transition-all">
                                    <div class="flex items-center gap-3">
                                        <input type="checkbox" class="visual-checkbox w-4 h-4 rounded">
                                        <span class="text-sm text-slate-600 font-bold group-hover/item:text-slate-900" x-text="brand.name"></span>
                                    </div>
                                    <span class="count-badge text-[10px] font-bold text-slate-400 bg-white shadow-sm border border-slate-100 px-2 py-0.5 rounded-full" x-text="brand.count"></span>
                                </li>
                            </template>
                        </ul>
                    </div>

                    <div class="filter-section mb-6 border-t border-slate-100 pt-6" x-data="{ open: false, searchOpen: false }">
                        <div class="flex items-center justify-between mb-2">
                            <button @click="open = !open" class="flex items-center gap-2 font-bold text-sm text-slate-800 hover:text-indigo-600 transition group">
                                <span class="w-1 h-4 bg-indigo-500 rounded-full group-hover:h-5 transition-all"></span> Publishing House
                            </button>
                            <div class="flex items-center gap-2">
                                <button @click="searchOpen = !searchOpen" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-indigo-50 text-slate-400 hover:text-indigo-600 transition" :class="searchOpen ? 'bg-indigo-50 text-indigo-600' : ''">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                </button>
                                <button @click="open = !open" class="text-slate-400 hover:text-indigo-600 transition">
                                    <svg class="w-4 h-4 transition-transform" :class="open ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                            </div>
                        </div>

                         <div x-show="searchOpen" x-collapse class="mb-3 overflow-hidden">
                            <div class="relative group">
                                <input type="text" placeholder="Search publishers..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all">
                                <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            </div>
                        </div>

                        <div x-show="open" x-collapse class="space-y-1">
                             <li class="filter-row flex items-center justify-between group cursor-pointer p-2 rounded-lg hover:bg-slate-50 transition">
                                <span class="text-sm text-slate-600 flex items-center gap-2"><svg class="w-3 h-3 text-slate-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H8l4-4 4 4h-3v4h-2z"/></svg> 123456</span>
                                <span class="count-badge text-[10px] text-slate-400 bg-white px-1.5 rounded shadow-sm">2</span>
                             </li>
                             <li class="filter-row flex items-center justify-between group cursor-pointer p-2 rounded-lg hover:bg-slate-50 transition">
                                <span class="text-sm text-slate-600 flex items-center gap-2"><svg class="w-3 h-3 text-slate-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H8l4-4 4 4h-3v4h-2z"/></svg> Unknown</span>
