<!DOCTYPE html>
<html data-theme='light' dir='rtl' lang='ar' class="overflow-x-hidden">
<head>
<meta charset='UTF-8'/>
<meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0' name='viewport'/>
<title>SmartTrans - منصة إدارة النقل المدرسي الذكية</title>

<!-- الخطوط -->
<link href='https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&display=swap' rel='stylesheet'/>
<link href='https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap' rel='stylesheet'/>

<!-- TailwindCSS -->
<script src='https://cdn.tailwindcss.com'></script>
<script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: {
                        50: '#eff6ff',
                        100: '#dbeafe',
                        500: '#3b82f6',
                        600: '#2563eb',
                        700: '#1d4ed8',
                        900: '#1e3a8a',
                    },
                    glass: {
                        100: 'rgba(255, 255, 255, 0.05)',
                        border: 'rgba(255, 255, 255, 0.15)',
                    },
                },
                animation: {
                    'float-slow': 'float 5s ease-in-out infinite',
                    'float-medium': 'float 3s ease-in-out infinite',
                    'float-fast': 'float 2s ease-in-out infinite',
                    'float-delayed': 'float 5s ease-in-out infinite 1s',
                    'float-random': 'floatRandom 8s ease-in-out infinite',
                    'shine': 'shine 1.5s infinite',
                    'pulse-glow': 'pulseGlow 2s infinite',
                    'spin-slow': 'spin 8s linear infinite',
                    'pop-icons': 'popIcons 0.4s ease-out forwards',
                    'dash': 'dash 20s linear infinite',
                    'modal-in': 'modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    'modal-out': 'modalOut 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                },
                keyframes: {
                    float: {
                        '0%, 100%': { transform: 'translateY(0)' },
                        '50%': { transform: 'translateY(-15px)' }
                    },
                    floatRandom: {
                        '0%, 100%': { transform: 'translate(0, 0) rotate(0deg)' },
                        '33%': { transform: 'translate(10px, -10px) rotate(5deg)' },
                        '66%': { transform: 'translate(-10px, 10px) rotate(-5deg)' }
                    },
                    shine: {
                        '0%': { transform: 'translateX(-100%)' },
                        '100%': { transform: 'translateX(100%)' }
                    },
                    pulseGlow: {
                        '0%, 100%': { boxShadow: '0 0 15px rgba(59, 130, 246, 0.3)' },
                        '50%': { boxShadow: '0 0 30px rgba(59, 130, 246, 0.6)' }
                    },
                    popIcons: {
                        '0%': { opacity: '0', transform: 'translate(0, 0) scale(0)' },
                        '100%': { opacity: '1', transform: 'translate(var(--tx), var(--ty)) scale(1)' }
                    },
                    dash: {
                        '0%': { strokeDashoffset: '1000' },
                        '100%': { strokeDashoffset: '0' }
                    },
                    modalIn: {
                        '0%': { opacity: '0', transform: 'scale(0.95) translateY(10px)' },
                        '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                    },
                    modalOut: {
                        '0%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        '100%': { opacity: '0', transform: 'scale(0.95) translateY(10px)' }
                    }
                }
            }
        }
    }
</script>

<!-- أيقونات Lucide -->
<script src='https://unpkg.com/lucide@latest'></script>

<!-- مكتبة AOS -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<!-- مكتبة SwiperJS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
/* =========================================
   1. VARIABLES & THEME CONFIGURATION
   ========================================= */
:root {
    --bg-body: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --bg-glass: rgba(255, 255, 255, 0.7);
    --bg-glass-hover: rgba(255, 255, 255, 0.9);
    --border-glass: rgba(255, 255, 255, 0.5);
    --shadow-glass: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
}

[data-theme='dark'] {
    --bg-body: #020617;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --bg-glass: rgba(15, 23, 42, 0.6);
    --bg-glass-hover: rgba(30, 41, 59, 0.8);
    --border-glass: rgba(255, 255, 255, 0.08);
    --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
}

html, body {
    overflow-x: hidden;
    width: 100%;
    position: relative;
    /* تحسين عرض الخطوط */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Tajawal', sans-serif;
    background-color: var(--bg-body);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
}

/* تحسين شريط التمرير */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.3); border-radius: 20px; }
::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.6); }

/* Lenis Scroll Fixes */
html.lenis { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto; }
.lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
.lenis.lenis-stopped { overflow: hidden; }
.lenis.lenis-scrolling iframe { pointer-events: none; }
/* =========================================
   2. UI COMPONENTS (Glass, Cards, Buttons)
   ========================================= */

/* Background Elements - استخدام will-change */
.bg-blobs { 
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    z-index: -1; overflow: hidden; pointer-events: none; 
}
.blob { 
    position: absolute; filter: blur(80px); opacity: 0.5; 
    will-change: transform; /* تحسين الأداء */
    animation: float 8s infinite alternate; 
}
.blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(59, 130, 246, 0.3), transparent); }
.blob-2 { bottom: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent); animation-delay: -4s; }

/* Decorative Shapes - إزالة التعقيد */
.shape-circle, .shape-dots {
    position: absolute; z-index: 0; pointer-events: none;
}
.shape-circle { border-radius: 50%; border: 2px solid rgba(59, 130, 246, 0.1); }
.shape-dots {
    width: 100px; height: 100px;
    background-image: radial-gradient(rgba(59, 130, 246, 0.2) 2px, transparent 2px);
    background-size: 10px 10px;
}

/* Glass Effect Optimization */
.glass {
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-glass);
    box-shadow: var(--shadow-glass);
    border-radius: 1.5rem;
    /* إزالة transition هنا لتجنب إعادة حساب الفلتر باستمرار */
}

.glass-card {
    background: var(--bg-glass);
    border: 1px solid var(--border-glass);
    backdrop-filter: blur(16px);
    /* استخدام translate3d لتفعيل GPU */
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    position: relative;
    overflow: hidden;
    will-change: transform, box-shadow;
}

.glass-card:hover {
    transform: translateY(-8px) scale(1.02); /* سيتم معالجته عبر GPU */
    border-color: rgba(59, 130, 246, 0.6);
    box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.25);
}

.glass-card::before {
    content: '';
    position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.4s ease;
    pointer-events: none; /* تحسين الأداء */
}
.glass-card:hover::before { left: 100%; }

/* Buttons */
.btn-gradient {
    background: linear-gradient(135deg, #3b82f6, #4f46e5);
    position: relative; overflow: hidden; z-index: 1;
    transition: transform 0.3s ease;
}
.btn-gradient::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #4f46e5, #3b82f6);
    z-index: -1; transition: opacity 0.3s ease; opacity: 0;
}
.btn-gradient:hover::before { opacity: 1; }
.btn-gradient:active { transform: scale(0.95); }

/* Navigation */
.nav-link-item { position: relative; }
.nav-link-item::after {
    content: ''; position: absolute; bottom: -4px; right: 50%; width: 0; height: 2px;
    background: #3b82f6; transition: width 0.3s ease, transform 0.3s ease;
    transform: translateX(50%); border-radius: 2px;
}
.nav-link-item:hover::after { width: 80%; }
/* =========================================
   3. 3D ELEMENTS (Phone, Laptop, Hero)
   ========================================= */

/* Hero 3D Card */
.hero-perspective {
    perspective: 2000px;
    transform-style: preserve-3d;
}

.hero-img-card {
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    will-change: transform;
}

.hero-img-card:hover {
    transform: translateZ(40px) scale(1.05); /* إزالة rotateY لمنع التشويش */
    box-shadow: 0 40px 70px -15px rgba(59, 130, 246, 0.5);
    z-index: 50;
}

/* Phone Styles */
#phone-frame {
    box-shadow: 
        0 0 0 2px #334155,
        0 0 0 5px #1e293b,
        0 20px 50px -10px rgba(0,0,0,0.5);
    backface-visibility: hidden; /* مهم للأداء */
    transform: translateZ(0); /* تفعيل GPU */
}

.phone-slide { display: flex; flex-direction: column; }
.perspective-1000 { perspective: 1000px; }

/* Laptop Styles */
.perspective-1500 { perspective: 1500px; }
.preserve-3d { transform-style: preserve-3d; }

#laptop-mockup {
    transform: rotateX(15deg);
    box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.4);
    transition: transform 0.5s ease;
    will-change: transform;
}
.group:hover #laptop-mockup { transform: rotateX(0deg) scale(1.02); }

/* Timeline Elements */
.timeline-line {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(to bottom, transparent, #3b82f6, #8b5cf6, transparent);
    transform: translateX(-50%);
}
.timeline-node {
    position: absolute; left: 50%; top: 2rem;
    transform: translateX(-50%); width: 20px; height: 20px;
    background: #3b82f6; border-radius: 50%;
    border: 4px solid var(--bg-body);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    z-index: 10; transition: background-color 0.3s, box-shadow 0.3s;
}
.group:hover .timeline-node { background-color: #8b5cf6; box-shadow: 0 0 0 6px rgba(139, 92, 246, 0.3); }

/* Modal */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    will-change: opacity;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
/* =========================================
   4. ANIMATIONS & KEYFRAMES
   ========================================= */

/* حركة الطفو (Floating) */
@keyframes float { 
    0% { transform: translate(0, 0); } 
    100% { transform: translate(20px, 20px); } 
}

@keyframes floatIcon {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
}
.floating-icon { 
    animation: floatIcon 6s ease-in-out infinite; 
    will-change: transform;
}

@keyframes floatSlow {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
}
.animate-float-slow { animation: floatSlow 6s ease-in-out infinite; }

@keyframes floatMedium {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(-5deg); }
}
.animate-float-medium { animation: floatMedium 4s ease-in-out infinite; }

/* حركة المحاكاة (Simulation) */
@keyframes driveAcross { 
    0% { transform: translateX(-10%); } 
    40% { transform: translateX(50%); } 
    60% { transform: translateX(50%); } 
    100% { transform: translateX(110%); } 
}
/* ملاحظة: استخدمت translateX بدلاً من left لتحسين الأداء */
.group:hover .sim-car-move { animation: driveAcross 3s linear infinite; }

@keyframes notifyPop { 
    0% { opacity: 0; transform: translateY(10px) scale(0.9); } 
    10% { opacity: 1; transform: translateY(0) scale(1); } 
    90% { opacity: 1; transform: translateY(0) scale(1); } 
    100% { opacity: 0; transform: translateY(-10px); } 
}
.group:hover .sim-notify-pop { animation: notifyPop 4s ease-in-out infinite; }

@keyframes gaugeMove { 
    0% { transform: rotate(-45deg); } 
    50% { transform: rotate(45deg); } 
    100% { transform: rotate(-45deg); } 
}
.group:hover .sim-gauge-needle { animation: gaugeMove 2s ease-in-out infinite alternate; }

@keyframes timelinePlay { 
    0% { width: 0%; } 
    100% { width: 100%; } 
}
.group:hover .sim-timeline-progress { animation: timelinePlay 3s linear infinite; }

@keyframes thumbMove { 
    0% { left: 0%; } 
    100% { left: 100%; } 
}
.group:hover .sim-timeline-thumb { animation: thumbMove 3s linear infinite; }

/* حركة الخط المتقطع */
@keyframes dash {
    to { stroke-dashoffset: -1000; }
}
.animate-dash-line {
    stroke-dasharray: 5;
    animation: dash 20s linear infinite;
    will-change: stroke-dashoffset;
}

/* حركة ظهور الأيقونات الطائرة */
@keyframes pop-icons {
    to { opacity: 1; transform: translate(var(--tx), var(--ty)); }
}
.fly-icon { position: absolute; opacity: 0; transition: all 0.3s ease; pointer-events: none; }
.group:hover .fly-icon-1 { animation: pop-icons 0.5s 0.05s forwards; --tx: -35px; --ty: -35px; }
.group:hover .fly-icon-2 { animation: pop-icons 0.5s 0.1s forwards; --tx: 35px; --ty: -45px; }
.group:hover .fly-icon-3 { animation: pop-icons 0.5s 0.15s forwards; --tx: 45px; --ty: 25px; }
/* تأثيرات النصوص والخلفيات */
.bg-300\% { background-size: 300% 300%; }
@keyframes gradientAnim {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
.animate-gradient { animation: gradientAnim 6s ease infinite; }

@keyframes shimmer {
    100% { transform: translateX(100%); }
}
.animate-shimmer { animation: shimmer 2s infinite; }

/* تأثير الوهج على الحدود */
.border-glow {
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.1), inset 0 0 10px rgba(59, 130, 246, 0.05);
}

/* المنظور للعناصر ثلاثية الأبعاد */
.perspective-2000 { perspective: 2000px; }
.transform-style-3d { transform-style: preserve-3d; }

/* أنيميشن الطفو العشوائي */
@keyframes floatRandom {
    0% { transform: translate(0, 0); }
    33% { transform: translate(10px, -10px); }
    66% { transform: translate(-5px, 5px); }
    100% { transform: translate(0, 0); }
}
.animate-float-random { animation: floatRandom 8s ease-in-out infinite; }

@keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
.animate-spin-slow { animation: spinSlow 20s linear infinite; }
</style>
</head>
<body class="selection:bg-blue-500 selection:text-white antialiased overflow-x-hidden">

      <div id="app_root"></div>

    <!-- السكريبتات -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <!-- مكتبة Lenis للتمرير السلس -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <script src="app_root.js"></script>
</body>
</html>
