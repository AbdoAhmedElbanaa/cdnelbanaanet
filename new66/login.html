<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MikroTik Luxury Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/all.min.css">
    <!-- ✅ GSAP Library Added -->
    <script src="./assets/gsap.min.js"></script>
    <link rel="stylesheet" href="./assets/style.css" />

</head>
<body data-theme="light">

    <div class="bg-anim-layer" id="bg-layer">
        <!-- JS Rain -->
    </div>

    <header>
        <!-- 🟢 STAGE 2: HEADER NETWORK IDENTITY (Right side in RTL) -->
        <div class="header-net-identity" id="header-identity">
            <div class="net-icon-box">
                <!-- Original Logo Image with Fallback -->
                <img src="assets/logo.png" alt="Logo" class="net-logo-small" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3670/3670157.png'">
                <div class="net-pulse"></div>
            </div>
            <div class="net-info">
                <div class="net-name">Trend Networks</div>
                <div class="net-desc"><div class="net-dot"></div> <span>Internet Provider</span></div>
            </div>
        </div>

        <!-- Left Controls (Clock + Theme Toggle) -->
        <div class="header-controls-left">
            <div class="clock-pill">
                <i class="far fa-clock" style="color:var(--accent)"></i>
                <span id="clock">00:00</span>
            </div>
            <div class="theme-btn" onclick="toggleTheme()"><i class="fas fa-moon"></i></div>
        </div>
    </header>

    <main>
        <!-- 🎬 STAGE 1: EXISTING INTRO STAGE (Kept exactly as is) -->
        <div class="intro-stage" id="intro-container">
            <div class="intro-particles-container" id="intro-particles"></div> 
            
            <div class="logo-wrapper">
                <div class="logo-ring ring-1"></div>
                <div class="logo-ring ring-2"></div>
                <div class="logo-glow" id="anim-glow"></div>
                <img src="assets/logo.png" alt="Logo" class="main-logo-img" id="anim-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3670/3670157.png'">
            </div>
            
            <div class="text-content">
                <div class="brand-name-container" id="txt-brand-container" dir="ltr"></div>
                <div class="brand-slogan" id="txt-slogan">internet provider 🚀</div>
            </div>
        </div>

        <!-- 🔥 STAGE 3: NEW MAIN CAFÉ HERO INTRO (Inserted Here) -->
        <div class="cafe-hero-section" id="cafe-hero">
            
            <!-- Pulse Background System -->
            <div class="cafe-bg-pulse-layer" id="cafe-pulse-layer">
                <!-- SVGs injected via JS for cleaner HTML -->
            </div>

            <!-- Smoke Layer -->
            <svg class="smoke-svg-layer" viewBox="0 0 200 300">
                <defs>
                    <filter id="smokeBlur">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
                    </filter>
                    <radialGradient id="smokeGrad">
                        <stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:0.4" />
                        <stop offset="100%" style="stop-color:rgb(255,255,255);stop-opacity:0" />
                    </radialGradient>
                </defs>
                <g id="smoke-group" filter="url(#smokeBlur)"></g>
            </svg>

            <!-- Logo & Wifi Waves -->
            <div class="cafe-logo-container">
                <div class="wifi-wave-layer" id="wifi-waves">
                    <!-- JS Injected Arcs -->
                </div>
                
                <!-- SVG Shisha Logo will be injected here -->
                
                <!-- 🌌 GALAXY ORBIT CONTAINER (Moved Here) -->
                <div id="hero-floating-icons"></div>
            </div>

            <!-- Text -->
            <div class="cafe-hero-text">
                <div class="cafe-3d-name">CAFÉ ROYALE</div>
                <div class="cafe-hero-desc">Premium Shisha & Lounge</div>
            </div>
        </div>

        <!-- 🔹 Main Login Card 🔹 -->
        <div class="card-container" id="login-card-container">
            <div class="login-panel" id="main-card">
                
                <div class="welcome-zone">
                    <div class="avatar-wrapper">
                        <div class="badge-icons-container" id="badge-particles"></div> 
                        <div class="avatar-circle">
                            <i class="fas fa-user-astronaut avatar-icon"></i>
                        </div>
                        <div class="avatar-pulse" id="avatar-pulse"></div>
                        <div class="mini-badge mb-1"><i class="fas fa-star"></i></div>
                        <div class="mini-badge mb-2"><i class="fas fa-check"></i></div>
                    </div>
                    
                    <div class="welcome-title">
                        <i class="fas fa-sparkles sparkle"></i> أهلاً بك يا بطل <i class="fas fa-sparkles sparkle"></i>
                    </div>

                    <div class="badge-viewport" id="badges-container">
                        <!-- Badges cycled via JS -->
                    </div>
                </div>

                <form action="$(link-login-only)" method="post" onsubmit="return validate()">
                    <input type="hidden" name="dst" value="$(link-orig)" />
                    <input type="hidden" name="popup" value="true" />
                    <input type="hidden" name="password" value=""> 

                    <div class="input-box">
                        <i class="fas fa-ticket-alt input-icon"></i>
                        <input type="tel" name="username" class="main-input" placeholder="رقم الكارت..." value="$(username)" autocomplete="off" inputmode="numeric" pattern="[0-9]*">
                    </div>

                    <button type="submit" class="btn-action" id="login-btn">
                        <div class="shine-effect"></div>
                        <i class="fas fa-wifi btn-deco-icon left"></i>
                        <span>تسجيل دخول</span>
                        <i class="fas fa-bolt btn-deco-icon right"></i>
                        <i class="fas fa-arrow-left"></i>
                    </button>
                </form>
                <div id="mt-error" style="display:none">$(error)</div>
            </div>
        </div>

        <!-- 🌀 Hub Section 🌀 -->
        <div class="hub-section" id="hub-section">
            <div class="hub-container" id="hub-container">
                <div class="hub-grid">
                    <div class="hub-btn hb-about" onclick="openModal('about')">
                        <i class="fas fa-info-circle hub-icon"></i>
                        <span class="hub-label">من نحن</span>
                    </div>
                    <div class="hub-btn hb-join" onclick="openModal('join')">
                        <i class="fas fa-rocket hub-icon"></i>
                        <span class="hub-label">انضم لنا</span>
                    </div>
                    <div class="hub-btn hb-menu" onclick="openModal('menu')">
                        <i class="fas fa-th-large hub-icon"></i>
                        <span class="hub-label">القائمة</span>
                    </div>
                </div>

                <div class="hub-vis-shape shape-1"></div>
                <div class="hub-vis-shape shape-2"></div>
            </div>
        </div>

        <!-- 📞 Customer Service Footer (Redesigned) 📞 -->
        <div class="cs-section" id="cs-section">
            <div class="cs-contacts" id="cs-contacts">
                <div class="cs-brand-side">
                     <div class="cs-logo-bubble">
                        <i class="fas fa-building"></i>
                     </div>
                     <div class="cs-text-group">
                        <div class="cs-main-txt">تواصل مع الشركة</div>
                        <div class="cs-sub-txt">Trend Networks لخدمات الإنترنت</div>
                     </div>
                </div>
                <a href="tel:01500066652" class="cs-phone-btn">
                    <span class="cs-phone-val">01500066652</span>
                    <div class="cs-phone-label">دعم فني <i class="fas fa-headset"></i></div>
                </a>
            </div>
        </div>

    </main>


    <!-- NEW TOAST STRUCTURE -->
    <div id="toast"></div>

    <!-- 🛑 STATIC MODAL OVERLAY (Controlled via display) -->
    <div id="static-modal-overlay" class="modal-overlay" style="display: none;"></div>

    <script>
        const BRAND = "Trend Networks"; 
        const JOIN_NUMBER = "01500066652"; 
        
        // --- Modal Templates ---
        const modalTemplates = {
            'about': `
                <div class="modal-box">
                    <button class="modal-close" type="button"><i class="fas fa-times"></i></button>
                    <div class="modal-icon-header about-header"><i class="fas fa-building"></i></div>
                    <h3 class="modal-title">من نحن</h3>
                    <p class="modal-desc">نحن <strong style="color:var(--primary)">Trends Networks</strong>، المزود الرائد لخدمات الإنترنت فائق السرعة.</p>
                    <div style="text-align:right; font-size:0.9rem; color:var(--text-muted); line-height:1.8;">
                        <p><i class="fas fa-check-circle" style="color:var(--success); margin-left:5px;"></i> خبرة أكثر من 10 سنوات.</p>
                        <p><i class="fas fa-check-circle" style="color:var(--success); margin-left:5px;"></i> دعم فني حقيقي 24 ساعة.</p>
                    </div>
                    <div class="about-social-grid">
                        <a href="https://wa.me/201500066652" target="_blank" class="social-btn sb-wa"><i class="fab fa-whatsapp"></i> واتساب</a>
                        <a href="mailto:support@trendnet.com" class="social-btn sb-mail"><i class="fas fa-envelope"></i> ايميل</a>
                    </div>
                </div>
            `,
            'join': `
                <div class="modal-box">
                    <button class="modal-close" type="button"><i class="fas fa-times"></i></button>
                    <div class="modal-icon-header join-header"><i class="fas fa-hand-shake"></i></div>
                    <h3 class="modal-title">كن جزءاً من العائلة!</h3>
                    <p class="modal-desc">انضم لفريقنا وابدأ مشوار نجاح جديد 💪
الرقم موجود تحت  تواصل معانا في أي وقت..</p>
                    <div class="number-display">
                        <span style="font-size:0.8rem; color:var(--text-muted)">رقم الهاتف</span>
                        <span class="the-number" id="join-number">01500066652</span>
                    </div>
                    <div class="join-actions">
                        <button class="btn-modal btn-copy" onclick="copyNumber()"><i class="fas fa-copy"></i> نسخ الرقم</button>
                        <button class="btn-modal btn-save" onclick="saveContact()"><i class="fas fa-user-plus"></i> تسجيل الرقم</button>
                    </div>
                </div>
            `,
            'menu': `
                <div class="modal-box">
                    <button class="modal-close" type="button"><i class="fas fa-times"></i></button>
                    <div class="menu-viewport">
                        <div class="menu-view active-view" id="menu-view-main">
                            <div class="menu-header-area">
                                <div class="modal-icon-header menu-header"><i class="fas fa-th-large"></i></div>
                                <h3 class="modal-title">القائمة الرئيسية</h3>
                            </div>
                            <ul class="menu-list">
                                <li class="menu-item" onclick="openSubMenu('speeds')"><span><i class="fas fa-tachometer-alt" style="margin-left:10px; color:var(--cyan)"></i>باقات السرعة</span><i class="fas fa-chevron-left"></i></li>
                                <li class="menu-item" onclick="openSubMenu('prices')"><span><i class="fas fa-tags" style="margin-left:10px; color:var(--gold)"></i>الأسعار والعروض</span><i class="fas fa-chevron-left"></i></li>
                                <li class="menu-item" onclick="openSubMenu('apps')"><span><i class="fas fa-mobile-alt" style="margin-left:10px; color:var(--success)"></i>تطبيقاتنا</span><i class="fas fa-chevron-left"></i></li>
                                <li class="menu-item" onclick="openSubMenu('cafe-menu')"><span><i class="fas fa-coffee" style="margin-left:10px; color:var(--gold)"></i>مينو الكافية</span><i class="fas fa-chevron-left"></i></li>
                                <li class="menu-item" onclick="openSubMenu('branches')"><span><i class="fas fa-map-marker-alt" style="margin-left:10px; color:var(--danger)"></i>فروعنا</span><i class="fas fa-chevron-left"></i></li>
                            </ul>
                        </div>
                        <div class="menu-view" id="menu-view-speeds">
                            <div class="back-btn-row" onclick="backToMain()"><i class="fas fa-arrow-right"></i> رجوع</div>
                            <h3 class="modal-title">باقات السرعة</h3>
                            <ul class="menu-list">
                                <li class="menu-item"><span>🚀 باقة 5 ميجا</span> <small>للتصفح</small></li>
                                <li class="menu-item"><span>⚡ باقة 10 ميجا</span> <small>للألعاب</small></li>
                            </ul>
                        </div>
                        <div class="menu-view" id="menu-view-prices">
                            <div class="back-btn-row" onclick="backToMain()"><i class="fas fa-arrow-right"></i> رجوع</div>
                            <h3 class="modal-title">الأسعار</h3>
                            <ul class="menu-list">
                                <li class="menu-item"><span>50 جنيه</span> <small>5 ميجا</small></li>
                            </ul>
                        </div>
                         <div class="menu-view" id="menu-view-apps">
                            <div class="back-btn-row" onclick="backToMain()"><i class="fas fa-arrow-right"></i> رجوع</div>
                            <h3 class="modal-title">التطبيقات</h3>
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px">
                                <div class="hub-btn" style="border-color:var(--primary)"><i class="fab fa-google-play hub-icon"></i><small>Android</small></div>
                                <div class="hub-btn" style="border-color:var(--text-main)"><i class="fab fa-apple hub-icon"></i><small>iOS</small></div>
                            </div>
                        </div>
                        <!-- ☕ NEW CAFE MENU VIEW -->
                        <div class="menu-view" id="menu-view-cafe-menu">
                            <div class="back-btn-row" onclick="backToMain()"><i class="fas fa-arrow-right"></i> رجوع</div>
                            <h3 class="modal-title">قائمة الكافية</h3>
                            <div class="cafe-menu-grid">
                                <img src="assets/menu1.jpg" alt="Menu Page 1" class="menu-img" onerror="this.src='https://placehold.co/300x400?text=Menu+Page+1'">
                                <img src="assets/menu2.jpg" alt="Menu Page 2" class="menu-img" onerror="this.src='https://placehold.co/300x400?text=Menu+Page+2'">
                            </div>
                        </div>
                        <div class="menu-view" id="menu-view-branches">
                            <div class="back-btn-row" onclick="backToMain()"><i class="fas fa-arrow-right"></i> رجوع</div>
                            <h3 class="modal-title">فروعنا</h3>
                            <div class="branch-list">
                                <div class="branch-card"><div class="branch-img-box"><i class="fas fa-city"></i></div><div class="branch-info"><div class="branch-name">فرع القاهرة</div></div><div class="branch-action"><i class="fas fa-location-arrow"></i></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            `
        };

        document.addEventListener("DOMContentLoaded", function() {
            // 1. Clock & Error
            setInterval(() => document.getElementById('clock').innerText=new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), 1000);
            handleError();
            
            if (typeof gsap === 'undefined') return;

            // ① Background Rain
            initBackgroundRain();

            // ④ Floating Icons on Cards
            initFloatingIconsOnCard('.login-panel', ['fa-lock', 'fa-shield-alt', 'fa-key']);
            initFloatingIconsOnCard('.hub-container', ['fa-cube', 'fa-layer-group', 'fa-rocket']);
            initFloatingIconsOnCard('.cs-contacts', ['fa-headset', 'fa-comments', 'fa-user-clock']);
            
            // ⑤ Button Pulse
            startLoginButtonPulse();

            // 🌟 Cinematic Intro Setup
            initCinematicIntro();
            
            // 🔥 Setup New Café Hero (SVGs etc)
            setupCafeHeroAssets();

            // --- 🔧 Initial States for Animations ---
            gsap.set([".card-container", ".hub-section", ".cs-section"], { autoAlpha: 0 }); 
            gsap.set("#login-btn", { scale: 1 });
            gsap.set("#header-identity", { autoAlpha: 0, x: -20 });
            gsap.set("#cafe-hero", { autoAlpha: 0, height: 0, overflow: "hidden", margin: 0 }); // Hidden & Collapsed

            // Master Timeline
            const tl = gsap.timeline({ defaults: { ease: "power4.out" } });

            // --- STAGE 1: EXISTING INTRO ---
            tl.to("#bg-layer", { duration: 3, scale: 1.1, ease: "sine.inOut" }, 0)
              // Rings Spin
              .to(".logo-ring", { rotation: 360, duration: 20, repeat: -1, ease: "none" }, 0)
              .fromTo(".logo-ring", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.5, stagger: 0.2 }, 0.1)
              // Logo Boom
              .fromTo("#anim-logo", 
                  { scale: 0, rotation: -180 }, 
                  { scale: 1, rotation: 0, duration: 1.5, ease: "elastic.out(1, 0.5)" }, 
              0.3)
              .to("#anim-glow", { duration: 1, opacity: 0.8, scale: 1.2, yoyo: true, repeat: 1 }, 0.5)
              // Explosion
              .add(() => { spawnIntroExplosion(); }, 0.5)
              // Typing
              .add(() => { animateBrandName(); }, 0.8)
              // Slogan
              .to(".brand-slogan", { duration: 1.2, opacity: 1, y: 0, ease: "power2.out" }, 2.0);

            // --- 🟢 STAGE 2: TRANSITION TO HEADER (The "Ascension" Effect) ---
            // Move Intro Up and Shrink
            tl.to("#intro-container", { 
                duration: 1.2, 
                y: -100, /* Reduced travel distance */
                scale: 0.4, 
                opacity: 0, 
                ease: "power3.inOut" 
            }, 2.4);

            // Animate Header Identity In (Matching the movement)
            tl.fromTo("#header-identity", 
                { y: 40, autoAlpha: 0 },
                { y: 0, autoAlpha: 1, duration: 0.8, ease: "back.out(1.2)" }, 
                "<0.5" // Start slightly after intro starts moving up
            );

            // Pulse effect on the new header element
            tl.to(".net-pulse", { duration: 0.4, opacity: 1, scale: 1.2, yoyo: true, repeat: 3 }, ">-0.2");

            // 🛑 Collapse the intro container space fully so Café Intro takes its place
            tl.to("#intro-container", { 
                height: 0, 
                minHeight: 0,
                marginBottom: 0, 
                padding: 0,
                duration: 0.8, 
                ease: "power2.inOut" 
            }, 2.6); 

            // --- 🔥 STAGE 3: MAIN CAFÉ INTRO ---
            // Expand Café Hero Container
            tl.to("#cafe-hero", { 
                height: "auto", 
                margin: "0 auto 40px auto", /* Reduced margin */
                duration: 0.8, 
                ease: "power2.out" 
            }, 3.0);

            // Fade in Café Content
            tl.to("#cafe-hero", { autoAlpha: 1, duration: 0.6 }, 3.2)
              .fromTo(".cafe-svg-logo", { scale: 0, rotation: 10 }, { scale: 1, rotation: 0, duration: 1.2, ease: "elastic.out(1, 0.6)" }, 3.2)
              .fromTo(".wifi-real-active", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, stagger: 0.2, duration: 0.5 }, 3.4)
              // 3D Text
              .to(".cafe-3d-name", { duration: 1, opacity: 1, rotateX: 0, ease: "back.out(1.5)" }, 3.5)
              .to(".cafe-hero-desc", { duration: 0.8, opacity: 1, y: 0, ease: "power2.out" }, 3.6)
              // Trigger Smoke Loop
              .add(() => { startSmokeAnimation(); startHeroBgPulse(); }, 3.5);

            // --- REVEAL LOGIN CARD (Slightly delayed to let Cafe Intro breathe) ---
            tl.to("#login-card-container", { duration: 1, y: 0, autoAlpha: 1, ease: "back.out(1.1)" }, 4.0)
              .from(".login-panel", { y: 60, rotateX: 15 }, "<")
              .from(".avatar-wrapper", { duration: 0.8, scale: 0, ease: "back.out(1.7)" }, ">0.2");

            tl.to("#hub-section", { duration: 0.8, y: 0, autoAlpha: 1, ease: "power2.out" }, ">0.2")
              .from(".hub-btn", { duration: 0.6, y: 20, opacity: 0, stagger: 0.1 }, "<0.1")
              .to("#cs-section", { duration: 0.8, y: 0, autoAlpha: 1 }, ">0.2")
              .from(".cs-item", { duration: 0.5, scale: 0.8, opacity: 0, stagger: 0.1 }, "<0.2");

            // Start Loops
            startBadgeCycleSystem();
            startContinuousAnimations();
            setupInteractions();
        });

        // --- ⚙️ NEW LOGIC FOR CAFÉ HERO ---

        function setupCafeHeroAssets() {
            // 1. Wifi Waves Generator (REAL Signal Bars)
            const waveContainer = document.getElementById('wifi-waves');
            waveContainer.innerHTML = ''; // Clear old arcs
            
            const svgNS = "http://www.w3.org/2000/svg";
            
            // Create a Standard Wi-Fi Icon Structure (Dot + 3 Arcs)
            // Using a single SVG for the wifi background to ensure alignment
            const wifiSvg = document.createElementNS(svgNS, "svg");
            wifiSvg.setAttribute("viewBox", "0 0 100 100");
            wifiSvg.style.position = "absolute";
            wifiSvg.style.width = "100%"; 
            wifiSvg.style.height = "100%";
            wifiSvg.style.opacity = "0.2"; // Subtle background effect
            
            // Dot
            const dot = document.createElementNS(svgNS, "circle");
            dot.setAttribute("cx", "50"); dot.setAttribute("cy", "80"); dot.setAttribute("r", "6");
            dot.classList.add("wifi-real-active");
            wifiSvg.appendChild(dot);

            // Arc 1 (Small)
            const arc1 = document.createElementNS(svgNS, "path");
            arc1.setAttribute("d", "M35,65 Q50,55 65,65");
            arc1.setAttribute("fill", "none"); arc1.setAttribute("stroke", "var(--accent)"); 
            arc1.setAttribute("stroke-width", "6"); arc1.setAttribute("stroke-linecap", "round");
            arc1.classList.add("wifi-real-active");
            wifiSvg.appendChild(arc1);

            // Arc 2 (Medium)
            const arc2 = document.createElementNS(svgNS, "path");
            arc2.setAttribute("d", "M20,50 Q50,30 80,50");
            arc2.setAttribute("fill", "none"); arc2.setAttribute("stroke", "var(--accent)"); 
            arc2.setAttribute("stroke-width", "6"); arc2.setAttribute("stroke-linecap", "round");
            arc2.classList.add("wifi-real-active");
            wifiSvg.appendChild(arc2);

            // Arc 3 (Large)
            const arc3 = document.createElementNS(svgNS, "path");
            arc3.setAttribute("d", "M5,35 Q50,5 95,35");
            arc3.setAttribute("fill", "none"); arc3.setAttribute("stroke", "var(--accent)"); 
            arc3.setAttribute("stroke-width", "6"); arc3.setAttribute("stroke-linecap", "round");
            arc3.classList.add("wifi-real-active");
            wifiSvg.appendChild(arc3);

            waveContainer.appendChild(wifiSvg);

            // 2. Realistic Shisha Construction
            const cafeContainer = document.querySelector('.cafe-logo-container');
            // Remove old cup SVG if it exists (by class or just append new one)
            const oldSvg = cafeContainer.querySelector('.cafe-svg-logo');
            if(oldSvg) oldSvg.remove();

            const shishaSvg = document.createElementNS(svgNS, "svg");
            shishaSvg.setAttribute("viewBox", "0 0 100 200");
            shishaSvg.classList.add("cafe-svg-logo");
            
            // Definitions for Gradients
            const defs = document.createElementNS(svgNS, "defs");
            shishaSvg.appendChild(defs);

            // Glass Gradient (Flask)
            const glassGrad = document.createElementNS(svgNS, "radialGradient");

        function startHeroBgPulse() {
            const container = document.getElementById('cafe-pulse-layer');
            const svgNS = "http://www.w3.org/2000/svg";
            
            // Tech/Geo Circles instead of simple strokes
            for(let i=0; i<3; i++) {
                const svg = document.createElementNS(svgNS, "svg");
                svg.setAttribute("viewBox", "0 0 100 100");
                svg.setAttribute("class", "pulse-shape");
                // Reduced size from 350px to 250px
                svg.style.width = "250px"; svg.style.height = "250px";
                
                const circle = document.createElementNS(svgNS, "circle");
                circle.setAttribute("cx", "50"); circle.setAttribute("cy", "50"); circle.setAttribute("r", "45");
                circle.setAttribute("stroke-dasharray", "10,5"); // Dashed line for tech look
                svg.appendChild(circle);
                container.appendChild(svg);

                gsap.fromTo(svg, 
                    { scale: 0.6, opacity: 0.4, rotation: 0 },
                    { scale: 1.4, opacity: 0, rotation: 90, duration: 4, repeat: -1, delay: i * 1.5, ease: "power1.out" }
                );
            }

            // Animate Hero Floating Icons - 🌌 GALAXY ORBIT SYSTEM 🌌
            const icons = document.querySelectorAll('.hero-float-icon');
            
            icons.forEach((icon, i) => {
                // Config for orbit
                const radiusX = gsap.utils.random(90, 140); // Horizontal Radius
                const radiusY = radiusX * 0.4; // Flattened for 3D perspective effect (Galaxy disk)
                const startAngle = parseFloat(icon.dataset.angle) || 0;
                const speed = gsap.utils.random(8, 15); // Duration for one orbit
                const clockwise = i % 2 === 0 ? 1 : -1; // Some go opposite? No, galaxy usually one way. Let's vary speed mostly.
                
                // 1. Orbit Animation
                // We use a proxy object to animate the 'angle' property
                let orbitObj = { angle: startAngle };
                
                gsap.to(orbitObj, {
                    angle: startAngle + (Math.PI * 2 * (clockwise ? 1 : 1)), // Full circle
                    duration: speed,
                    repeat: -1,
                    ease: "none",
                    onUpdate: () => {
                        // Calculate position based on current angle
                        const curAngle = orbitObj.angle;
                        const x = Math.cos(curAngle) * radiusX;
                        const y = Math.sin(curAngle) * radiusY;
                        
                        // Z-index sorting for 3D effect (objects in front vs back)
                        const zScale = (Math.sin(curAngle) + 1) / 2; // 0 (back) to 1 (front)
                        const scale = 0.8 + (zScale * 0.5); // Scale between 0.8 and 1.3
                        const opacity = 0.5 + (zScale * 0.5); // Fade slightly at back
                        const zIndex = Math.sin(curAngle) > 0 ? 20 : 5; // Behind or in front of logo

                        gsap.set(icon, {
                            x: x,
                            y: y,
                            scale: scale,
                            opacity: opacity,
                            zIndex: zIndex
                        });
                    }
                });

                // 2. Breathing/Floating Self-Animation (The "متنفسه" part)
                gsap.to(icon, {
                    rotation: gsap.utils.random(-20, 20),
                    duration: gsap.utils.random(2, 4),
                    yoyo: true,
                    repeat: -1,
                    ease: "sine.inOut"
                });
                
                // Color pulse
                gsap.to(icon, {
                    color: i % 2 === 0 ? "var(--gold)" : "var(--primary)",
                    duration: gsap.utils.random(3, 6),
                    repeat: -1,
                    yoyo: true
                });
            });
        }

            if (!modalOverlay) return;

            if(closeBtn) {

        function closeCurrentModal() {

            document.onkeydown = null;

            if(closeBtn) closeBtn.onclick = null;

            const box = modalOverlay.querySelector('.modal-box');
            if(box) gsap.to(box, { scale: 0.8, opacity: 0, y: 50, duration: 0.25, ease: "power2.in" });

            gsap.to(modalOverlay, {

                    modalOverlay.innerHTML = '';

            });

            if(e && e !== "$(error)") {
                if(e.includes('invalid')) showToast("بيانات خطأ");
                else if(e.includes('limit')) showToast("الرصيد انتهى");
                else if(e.includes('user')) showToast("رقم الكارت خطأ");
                else showToast("تأكد من الرقم");
            }
        }

        function validate() {
            if(!document.querySelector('input[name="username"]').value) { showToast("اكتب الكارت يا بطل!"); return false; }
            return true;
        }
    </script>
</body>
</html>
