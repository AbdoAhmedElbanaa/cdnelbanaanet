    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        /* Sidebar Specific Scrollbar */
        .sidebar-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background-color: #e2e8f0;
            border-radius: 20px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background-color: #cbd5e1;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
            transition: transform 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: linear-gradient(to right, #4f46e5 0%, #cbd5e1 100%); /* Visualization of progress */
            border-radius: 4px;
        }

        /* Custom Checkbox Visualization */
        .visual-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .visual-checkbox:checked {
            background-color: #4f46e5;
            border-color: #4f46e5;
            transform: scale(1.1);
        }
        .visual-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 12px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
        }

        /* Badge Animation */
        .count-badge {
            transition: all 0.3s;
        }
        .filter-row:hover .count-badge {
            background-color: #4f46e5;
            color: white;
            transform: scale(1.1);
        }
        
        /* Category Icon Hover */
        .filter-row:hover .cat-icon-visual {
            transform: rotate(15deg) scale(1.2);
            color: #4f46e5;
        }
    </style>
    <script>

                        primary: '#3b82f6',
                        secondary: '#0f172a',

                    }

            }
        }
    </script>
</head>
