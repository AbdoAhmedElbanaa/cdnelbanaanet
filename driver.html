<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sook | لوحة السائق</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --danger-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden; /* Prevent scrolling */
            -webkit-tap-highlight-color: transparent;
        }

        /* Full Screen Map */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #1a1a1a;
        }

        /* Ultra Glassy Effect */
        .glass-sheet {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
        }

        .glass-pill {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .glass-sidebar {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(20px);
        }

        /* Animations */
        .slide-up-enter { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .pulse-ring {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.4);
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }
        
        /* REAL-TIME SMOOTHING: Add transition to marker movement */
        .leaflet-marker-icon.custom-div-icon {
            transition: transform 0.3s linear;
        }

        /* Hide specific Leaflet controls */
        .leaflet-control-container .leaflet-routing-container { display: none; }
        .leaflet-control-attribution { display: none; }

        /* Safe Area Spacing for Notch/Home Bar */
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }

        /* Custom Scrollbar for horizontal lists */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen relative">

    <!-- Sidebar Overlay -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/80 z-[60] hidden transition-opacity duration-300 backdrop-blur-sm opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed top-0 right-0 h-full w-[80%] max-w-sm glass-sidebar z-[70] transform translate-x-full transition-transform duration-300 ease-out pt-safe px-6 shadow-2xl">
        <div class="flex justify-between items-center mb-8 mt-4">
            <div>
                <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-l from-emerald-400 to-blue-500">Sook Driver</h2>
                <p class="text-xs text-gray-400">الإصدار 2.1 (خلفية نشطة)</p>
            </div>
            <button onclick="toggleSidebar()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-gray-300 active:bg-white/10"><i class="fas fa-times text-lg"></i></button>
        </div>
        
        <div class="flex items-center gap-4 p-4 rounded-2xl bg-white/5 border border-white/5 mb-8">
            <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-500 to-purple-600 flex items-center justify-center text-lg font-bold shadow-lg shadow-blue-500/20">S</div>
            <div>
                <p class="font-bold">كابتن سامي</p>
                <div class="flex items-center gap-2 mt-1">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
                    <p class="text-xs text-emerald-400">متصل بالإنترنت</p>
                </div>
            </div>
        </div>

        <nav class="space-y-3">
            <a href="#" class="flex items-center gap-4 p-4 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold">
                <i class="fas fa-map-marked-alt w-6"></i> <span>الخريطة المباشرة</span>
            </a>
            <a href="#" class="flex items-center gap-4 p-4 rounded-xl hover:bg-white/5 text-gray-300 transition">
                <i class="fas fa-history w-6"></i> <span>سجل الرحلات</span>
            </a>
            <a href="#" class="flex items-center gap-4 p-4 rounded-xl hover:bg-white/5 text-gray-300 transition">
                <i class="fas fa-wallet w-6"></i> <span>المحفظة (250 ر.س)</span>
            </a>
            <a href="#" class="flex items-center gap-4 p-4 rounded-xl hover:bg-white/5 text-gray-300 transition">
                <i class="fas fa-cog w-6"></i> <span>الإعدادات</span>
            </a>
        </nav>
    </aside>

    <!-- Map Background -->
    <div id="map"></div>

    <!-- UI Layer -->
    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between">
        
        <!-- Top Floating Header -->
        <div class="pointer-events-auto p-4 pt-safe flex flex-col gap-3">
            <!-- Top Bar -->
            <div class="flex justify-between items-start">
                <button onclick="toggleSidebar()" class="glass-pill w-11 h-11 rounded-full flex items-center justify-center text-white active:scale-95 transition shadow-lg">
                    <i class="fas fa-bars text-lg"></i>
                </button>
                
                <div onclick="locateUser(true)" id="gpsStatus" class="glass-pill px-4 py-2 rounded-full flex items-center gap-2 cursor-pointer active:scale-95 transition shadow-lg">
                    <span class="w-2 h-2 bg-gray-400 rounded-full" id="gpsIndicator"></span>
                    <span class="text-xs font-bold" id="gpsText">تفعيل GPS</span>
                </div>
            </div>

            <!-- Stats/Info Chips (Horizontal Scroll) -->
            <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 mask-linear">
                <!-- Route Info Chip (Hidden by default) -->
                <div id="routeInfo" class="hidden glass-pill px-4 py-3 rounded-2xl flex items-center gap-3 min-w-max border-l-4 border-l-emerald-500 animate-fade-in-down">
                    <div class="bg-emerald-500/20 p-2 rounded-lg text-emerald-400">
                        <i class="fas fa-route"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400">الوقت المقدر</p>
                        <p class="font-bold text-lg leading-none" id="routeTime">-- د</p>
                    </div>
                    <div class="h-8 w-px bg-white/10 mx-1"></div>
                    <div>
                        <p class="text-xs text-gray-400">المسافة</p>
                        <p class="font-bold text-lg leading-none" id="routeSummary">-- كم</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hint Overlay -->
        <div id="mapHint" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none text-center opacity-80">
            <div class="glass-pill px-6 py-3 rounded-full text-sm font-semibold text-blue-100 shadow-xl inline-flex items-center gap-2">
                <i class="fas fa-fingerprint text-blue-400 animate-pulse"></i>
                اضغط مطولاً أو انقر لتحديد وجهة
            </div>
        </div>

        <!-- Bottom Controls Area -->
        <div class="pointer-events-auto flex flex-col items-end px-4 pb-4 gap-4">
            
            <!-- Recenter FAB -->
            <button onclick="locateUser(true)" class="glass-pill w-12 h-12 rounded-full flex items-center justify-center text-white text-xl shadow-lg active:scale-90 transition mb-2 bg-slate-800/90 border border-slate-600">
                <i class="fas fa-crosshairs"></i>
            </button>

            <!-- Loading Indicator (Centered) -->
            <div id="loadingRoute" class="hidden absolute inset-0 bg-black/40 backdrop-blur-sm z-[50] flex flex-col items-center justify-center pointer-events-auto">
                <div class="w-16 h-16 border-4 border-emerald-500/30 border-t-emerald-500 rounded-full animate-spin mb-4"></div>
                <span class="font-bold text-lg">جاري التوجيه...</span>
            </div>

        </div>
    </div>

    <!-- Bottom Sheet (Draggable Look) -->
    <div id="tripPanel" class="absolute bottom-0 left-0 right-0 z-20 glass-sheet rounded-t-[30px] p-6 pb-safe transition-transform duration-300 transform translate-y-0">
        <!-- Drag Handle -->
        <div class="w-12 h-1.5 bg-white/10 rounded-full mx-auto mb-6"></div>

        <div class="flex items-end justify-between mb-6">
            <div>
                <p class="text-gray-400 text-xs font-medium mb-1 tracking-wider uppercase">السرعة الحالية</p>
                <div class="flex items-baseline gap-1">
                    <span class="text-5xl font-black text-white tracking-tighter" id="speedDisplay">0</span>
                    <span class="text-sm font-semibold text-gray-400">كم/س</span>
                </div>
            </div>
            
            <div class="text-left bg-white/5 px-4 py-2 rounded-xl border border-white/5">
                <p class="text-gray-400 text-[10px] mb-0.5">المسافة المقطوعة</p>
                <p class="text-xl font-bold text-emerald-400 font-mono" id="distanceDisplay">0.0 <span class="text-xs text-gray-500">كم</span></p>
            </div>
        </div>

        <div class="grid grid-cols-5 gap-3">
            <!-- Main Action Button (Span 4) -->
            <button id="actionBtn" onclick="toggleTracking()" class="col-span-4 h-14 rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:to-emerald-500 text-white font-bold text-lg shadow-[0_4px_20px_rgba(16,185,129,0.3)] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                <i class="fas fa-location-arrow"></i>
                <span>بدء الرحلة</span>
            </button>
            
            <!-- Simulation Toggle Button (Span 1) -->
            <button onclick="simulateRoute()" id="simBtn" class="col-span-1 h-14 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/10 flex items-center justify-center text-yellow-400 text-xl active:scale-90 transition relative overflow-hidden group">
                <i class="fas fa-gamepad relative z-10"></i>
                <div class="absolute inset-0 bg-yellow-400/10 opacity-0 group-hover:opacity-100 transition"></div>
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        // --- Variables ---
        let map, userMarker, pathLine;
        let routingControl = null;
        let watchId = null;
        let isTracking = false;
        let isSimulating = false;
        let wasTrackingBeforeSimulation = false;
        let wakeLock = null; // Wake Lock Variable for background activity
        
        let currentPos = { lat: 0, lng: 0 };
        let pathCoordinates = [];
        let totalDistance = 0;
        let selectedRouteCoordinates = [];

        // DOM Elements
        const speedDisplay = document.getElementById('speedDisplay');
        const distanceDisplay = document.getElementById('distanceDisplay');
        const actionBtn = document.getElementById('actionBtn');
        const simBtn = document.getElementById('simBtn');
        const gpsIndicator = document.getElementById('gpsIndicator');
        const gpsText = document.getElementById('gpsText');
        const routeInfo = document.getElementById('routeInfo');
        const routeSummary = document.getElementById('routeSummary');
        const routeTime = document.getElementById('routeTime');
        const mapHint = document.getElementById('mapHint');
        const loadingRoute = document.getElementById('loadingRoute');

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            locateUser(true);
        });

        // --- Wake Lock Implementation ---
        // This keeps the screen on, which allows the browser to keep GPS active in "background" (foreground service equivalent for web)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock is active (Background tracking enabled)');
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock was released');
                    });
                }
            } catch (err) {
                console.error(`Wake Lock Error: ${err.name}, ${err.message}`);
            }
        }

        // Re-acquire Wake Lock if visibility changes (e.g. user minimized then returned)
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        function initMap() {
            // Dark map tiles for professional look
            map = L.map('map', { 
                zoomControl: false,
                attributionControl: false 
            }).setView([30.0444, 31.2357], 15);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 20,
                subdomains: 'abcd',
            }).addTo(map);

            // Car Marker with Pulse Effect
            const carIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="relative w-full h-full">
                        <div class="pulse-ring"></div>
                        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 bg-blue-500 rounded-full border-2 border-white p-1 shadow-lg">
                            <i class="fas fa-location-arrow text-white text-sm transform -rotate-45 block"></i>
                        </div>
                       </div>`,
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
            userMarker = L.marker([0, 0], {icon: carIcon});

            pathLine = L.polyline([], {
                color: '#10b981',
                weight: 6,
                opacity: 0.8,
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            map.on('click', function(e) {
                if(isSimulating) { alert("يرجى إيقاف المحاكاة لتغيير الوجهة"); return; }
                calculateRoute(e.latlng.lat, e.latlng.lng);
            });
        }

        function calculateRoute(destLat, destLng) {
            if (currentPos.lat === 0) {
                alert("جاري تحديد موقعك...");
                locateUser();
                return;
            }

            loadingRoute.classList.remove('hidden');
            mapHint.classList.add('hidden');

            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }

            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(currentPos.lat, currentPos.lng),
                    L.latLng(destLat, destLng)
                ],
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' }),
                lineOptions: {
                    styles: [
                        {color: '#000', opacity: 0.3, weight: 12}, // Shadow
                        {color: '#3b82f6', opacity: 0.9, weight: 6} // Main Line
                    ],
                    extendToWaypoints: true,
                    missingRouteTolerance: 10
                },
                showAlternatives: false,
                createMarker: function(i, wp, nWps) {
                    if (i === nWps - 1) {
                        return L.marker(wp.latLng, {
                            icon: L.divIcon({
                                className: 'dest-icon',
                                html: '<div class="text-red-500 text-4xl drop-shadow-2xl filter"><i class="fas fa-map-marker-alt"></i></div>',
                                iconSize: [40, 40],
                                iconAnchor: [20, 40]
                            })
                        });
                    }
                    return null;
                },
                addWaypoints: false,
                fitSelectedRoutes: true,
                show: false
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                loadingRoute.classList.add('hidden');
                const bestRoute = e.routes[0];
                selectedRouteCoordinates = bestRoute.coordinates;

                const distKm = (bestRoute.summary.totalDistance / 1000).toFixed(1);
                const timeMin = Math.round(bestRoute.summary.totalTime / 60);

                routeInfo.classList.remove('hidden');
                routeInfo.classList.add('flex');
                routeSummary.innerText = `${distKm} كم`;
                routeTime.innerText = `${timeMin} د`;
            });

            routingControl.on('routingerror', function() {
                loadingRoute.classList.add('hidden');
                alert("تعذر الوصول لهذا الموقع.");
            });
        }

        function locateUser(centerMap = false) {
            if (!navigator.geolocation) {
                gpsText.innerText = "غير مدعوم";
                return;
            }

            gpsText.innerText = "جاري البحث...";
            gpsIndicator.className = "w-2 h-2 bg-yellow-400 rounded-full animate-pulse";

            const options = { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    updateUserPosition(latitude, longitude, 0, centerMap);
                    
                    if (!map.hasLayer(userMarker)) userMarker.addTo(map);
                    
                    gpsText.innerText = "GPS نشط";
                    gpsIndicator.className = "w-2 h-2 bg-emerald-400 rounded-full shadow-[0_0_10px_#34d399]";
                    gpsText.classList.add('text-emerald-400');
                },
                (error) => {
                    console.error("GPS Error", error);
                    gpsText.innerText = "فشل الاتصال";
                    gpsIndicator.className = "w-2 h-2 bg-red-500 rounded-full";
                    gpsText.classList.remove('text-emerald-400');
                    fallbackLocation(centerMap);
                },
                options
            );
        }

        function fallbackLocation(centerMap) {
            if(currentPos.lat === 0) {
                 updateUserPosition(30.0444, 31.2357, 0, centerMap); // Cairo
                 if (!map.hasLayer(userMarker)) userMarker.addTo(map);
            }
        }

        let simTimer;
        function simulateRoute() {
            if (isSimulating) {
                stopSimulation();
                return;
            }

            if (selectedRouteCoordinates.length === 0) {
                alert("حدد وجهة على الخريطة أولاً!");
                return;
            }
            
            if (isTracking) {
                wasTrackingBeforeSimulation = true;
                stopTracking(false); // Don't clear data, just pause
            } else {
                wasTrackingBeforeSimulation = false;
            }

            isSimulating = true;
            actionBtn.disabled = true;
            actionBtn.classList.add('opacity-50', 'grayscale');
            
            simBtn.innerHTML = '<i class="fas fa-stop text-red-500 animate-pulse"></i>';
            simBtn.classList.add('bg-red-500/10', 'border-red-500/20');

            let index = 0;
            const intervalTime = 80; // Smooth 60fps feel

            simTimer = setInterval(() => {
                if (index >= selectedRouteCoordinates.length) {
                    stopSimulation();
                    alert("الرحلة انتهت!");
                    return;
                }

                const coord = selectedRouteCoordinates[index];
                const fakeSpeed = 50 + Math.random() * 10;
                
                updateUserPosition(coord.lat, coord.lng, fakeSpeed / 3.6);
                index++;

            }, intervalTime);
        }

        function stopSimulation() {
            isSimulating = false;
            clearInterval(simTimer);
            
            actionBtn.disabled = false;
            actionBtn.classList.remove('opacity-50', 'grayscale');
            
            simBtn.innerHTML = '<i class="fas fa-gamepad"></i>';
            simBtn.classList.remove('bg-red-500/10', 'border-red-500/20');
            
            speedDisplay.innerText = "0";

            // Restore position to start of route
            if (selectedRouteCoordinates.length > 0) {
                 const startPoint = selectedRouteCoordinates[0];
                 updateUserPosition(startPoint.lat, startPoint.lng, 0, true);
            }

            if (wasTrackingBeforeSimulation) {
                startTracking(false);
                wasTrackingBeforeSimulation = false;
            }
        }

        function toggleTracking() {
            if(isSimulating) return;
            if (isTracking) {
                stopTracking(true);
            } else {
                // Clear old session
                pathCoordinates = [];
                totalDistance = 0;
                pathLine.setLatLngs([]);
                distanceDisplay.innerHTML = `0.0 <span class="text-xs text-gray-500">كم</span>`;
                startTracking(true);
            }
        }

        async function startTracking(updateUI = true) {
            if (!navigator.geolocation) return;
            isTracking = true;

            // Request Wake Lock to allow "background" tracking (by keeping screen/cpu awake)
            await requestWakeLock();
            
            if(updateUI) {
                actionBtn.innerHTML = `<i class="fas fa-stop-circle animate-pulse"></i><span>إنهاء الرحلة</span>`;
                actionBtn.classList.replace('from-emerald-500', 'from-red-500');
                actionBtn.classList.replace('to-emerald-600', 'to-red-600');
                actionBtn.classList.replace('shadow-[0_4px_20px_rgba(16,185,129,0.3)]', 'shadow-[0_4px_20px_rgba(239,68,68,0.3)]');
            }
            
            // Watch with NO CACHE and HIGH FREQUENCY
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude, speed } = position.coords;
                    updateUserPosition(latitude, longitude, speed);
                },
                (error) => console.error(error),
                { 
                    enableHighAccuracy: true, 
                    maximumAge: 0, 
                    timeout: 10000 // Increased slightly to avoid timeout errors in background
                }
            );
        }

        function stopTracking(clearUI = true) {
            isTracking = false;
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            // Release Wake Lock to save battery
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                });
            }
            
            if(clearUI) {
                actionBtn.innerHTML = `<i class="fas fa-location-arrow"></i><span>بدء الرحلة</span>`;
                actionBtn.classList.replace('from-red-500', 'from-emerald-500');
                actionBtn.classList.replace('to-red-600', 'to-emerald-600');
                actionBtn.classList.replace('shadow-[0_4px_20px_rgba(239,68,68,0.3)]', 'shadow-[0_4px_20px_rgba(16,185,129,0.3)]');
                speedDisplay.innerText = "0";
            }
        }

        function updateUserPosition(lat, lng, speed = 0, centerMap = false) {
            const prevLatLng = L.latLng(currentPos.lat, currentPos.lng);
            currentPos = { lat, lng };
            const newLatLng = L.latLng(lat, lng);

            userMarker.setLatLng(newLatLng);
            
            // Auto Rotate Marker (Rough estimation)
            if(prevLatLng.lat !== 0) {
                 const angle = Math.atan2(newLatLng.lng - prevLatLng.lng, newLatLng.lat - prevLatLng.lat) * 180 / Math.PI;
                 const markerIcon = userMarker.getElement().querySelector('.fa-location-arrow');
                 if(markerIcon) markerIcon.style.transform = `rotate(${angle}deg)`;
            }

            if (centerMap || isTracking || isSimulating) {
                // VERY FAST PAN for real-time feel
                map.panTo(newLatLng, {animate: true, duration: 0.1, easeLinearity: 0.5});
            }

            if (isTracking || isSimulating) {
                // Low threshold (1m) to capture every moment
                if (pathCoordinates.length === 0 || prevLatLng.distanceTo(newLatLng) > 1) {
                    pathCoordinates.push([lat, lng]);
                    pathLine.setLatLngs(pathCoordinates);
                    
                    if (pathCoordinates.length > 1) {
                        totalDistance += prevLatLng.distanceTo(newLatLng);
                        distanceDisplay.innerHTML = `${(totalDistance / 1000).toFixed(1)} <span class="text-xs text-gray-500">كم</span>`;
                    }
                }
                const kmh = speed ? (speed * 3.6).toFixed(0) : 0;
                speedDisplay.innerText = kmh;
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }
    </script>
</body>
</html>
