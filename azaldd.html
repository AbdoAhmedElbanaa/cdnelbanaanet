<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Console | Azal Hotel App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.2) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0.2) 0, transparent 50%);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Custom Select */
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
        }
    </style>

    <script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script defer>
        window.onload = function () {
            if (typeof emailjs !== 'undefined') {
                emailjs.init({
                    publicKey: "YOUR_PUBLIC_KEY_HERE"
                });
            }
        };
    </script>

    <script defer src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyDIdWjWzDtmIyac6F5p4sHQXNGD49--psg",
                projectId: "azalapp-b67f3",
                databaseURL: "https://azalapp-b67f3-default-rtdb.europe-west1.firebasedatabase.app"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const database = firebase.database();

            // Global UI Elements
            const ordersContainer = document.getElementById('orders-grid');
            const totO = document.getElementById('tot-orders');
            const totP = document.getElementById('tot-pending');
            const totC = document.getElementById('tot-completed');
            const notificationSound = document.getElementById('notification-sound');

            let existingOrderIds = new Set();
            let isFirstLoad = true;
            let isMuted = false;
            const statusColors = {
                'pending': 'bg-yellow-500/20 text-yellow-500 border-yellow-500/30',
                'preparing': 'bg-blue-500/20 text-blue-400 border-blue-500/30',
                'delivered': 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
                'completed': 'bg-purple-500/20 text-purple-400 border-purple-500/30',
                'cancelled': 'bg-red-500/20 text-red-400 border-red-500/30'
            };

            let showAccomplished = false;

            // Listen to orders node
            const ordersRef = database.ref('orders');
            ordersRef.on('value', (snapshot) => {
                renderDashboard(snapshot);
            });

            function renderDashboard(snapshot) {
                ordersContainer.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    ordersContainer.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">No orders found.</div>';
                    updateStats(0, 0, 0);
                    existingOrderIds.clear();
                    isFirstLoad = false;
                    return;
                }

                const allOrders = [];
                let pendingCount = 0;
                let accomplishedCount = 0;
                let hasNewOrder = false;

                for (const key in data) {
                    if (!isFirstLoad && !existingOrderIds.has(key)) {
                        if (data[key].status === 'pending') hasNewOrder = true;
                    }
                    existingOrderIds.add(key);

                    const order = { id: key, ...data[key] };
                    allOrders.push(order);
                    if (order.status === 'pending') pendingCount++;
                    if (order.status === 'completed') accomplishedCount++;
                }

                if (hasNewOrder && !isMuted) {
                    notificationSound.play().catch(e => console.log("Autoplay blocked or audio error:", e));
                    showToast("New order received!");
                    showBrowserNotification("New Order Received", "A new room service order is waiting for attention.");
                }
                isFirstLoad = false;

                // Sort by timestamp
                allOrders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                updateStats(allOrders.length, pendingCount, accomplishedCount);

                const filteredOrders = allOrders.filter(o => 
                    showAccomplished ? o.status === 'completed' : o.status !== 'completed'
                );

                if (filteredOrders.length === 0) {
                    ordersContainer.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10">No ${showAccomplished ? 'accomplished' : 'active'} orders found.</div>`;
                    return;
                }

                filteredOrders.forEach(order => {
                    const timeStr = order.timestamp ? new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--:--';
                    let itemsHTML = '';
                    if (order.items && Array.isArray(order.items)) {
                        order.items.forEach(it => {
                            itemsHTML += `
                                <div class="flex justify-between text-sm text-gray-300 py-1 border-b border-gray-700/50 last:border-0">
                                    <span>${it.quantity}x ${it.title}</span>
                                    <span>${it.price} L.E</span>
                                </div>`;
                        });
                    }

                    const isCompleted = order.status === 'completed';
                    const userConfirmed = order.userConfirmed === true;

                    const cardHTML = `
                        <div class="glass-card rounded-2xl p-5 flex flex-col justify-between transition-transform duration-300 ${isCompleted ? 'opacity-90' : 'hover:-translate-y-1'}">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-xl font-bold tracking-tight text-white mb-1">Room ${order.roomNumber || 'N/A'}</h3>
                                    <div class="flex items-center gap-2">
                                        <p class="text-xs text-gray-400 flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                            ${timeStr}
                                        </p>
                                        ${userConfirmed ? `<span class="bg-blue-500/20 text-blue-400 text-[10px] px-1.5 py-0.5 rounded border border-blue-500/30 font-bold uppercase tracking-tighter">Verified</span>` : ''}
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 uppercase tracking-wider font-semibold">ID: ${order.id.slice(-6)}</p>
                                </div>
                                <div class="text-right">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${statusColors[order.status] || 'bg-gray-500/20 text-gray-300 border-gray-500/30'}">
                                        ${(order.status || 'unknown').toUpperCase()}
                                    </span>
                                    <p class="mt-2 text-lg font-bold text-emerald-400">${order.totalPrice || 0} L.E</p>
                                </div>
                            </div>
                            <div class="bg-gray-900/40 rounded-xl p-3 mb-5 max-h-[140px] overflow-y-auto">
                                ${itemsHTML || '<p class="text-xs text-gray-500">No items</p>'}
                            </div>
                            <div class="mt-auto">
                                ${isCompleted ? `
                                <div class="w-full bg-slate-800/40 border border-slate-700/50 text-gray-500 text-sm rounded-lg p-2.5 text-center flex items-center justify-center gap-2">
                                    <svg class="w-4 h-4 text-purple-400" fill="currentColor" viewBox="0 0 20 20"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path></svg>
                                    Accomplished Order
                                </div>
                                ` : `
                                <label class="block text-xs text-gray-400 mb-2 uppercase tracking-wide font-semibold">Update Status</label>
                                <select onchange="window.handleStatusChange('${order.id}', this.value, '${order.roomNumber}')" 
                                        class="w-full bg-slate-800/80 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 appearance-none outline-none">
                                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="preparing" ${order.status === 'preparing' ? 'selected' : ''}>Preparing</option>
                                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="completed" ${order.status === 'completed' ? 'selected' : ''}>Accomplished</option>
                                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                                `}
                            </div>
                            ${order.statusReason ? `
                            <div class="mt-4 p-2 rounded bg-indigo-500/10 border border-indigo-500/20">
                                <p class="text-[10px] uppercase text-indigo-300 font-bold mb-1 tracking-wider text-center">Note / Reason</p>
                                <p class="text-xs text-gray-300 text-center italic">"${order.statusReason}"</p>
                            </div>
                            ` : ''}
                        </div>`;
                    ordersContainer.insertAdjacentHTML('beforeend', cardHTML);
                });
            }

            window.toggleView = function() {
                showAccomplished = !showAccomplished;
                const btn = document.getElementById('view-toggle-btn');
                const title = document.getElementById('feed-title');
                
                if (showAccomplished) {
                    btn.innerHTML = 'Show Live Feed';
                    btn.classList.replace('bg-indigo-600/20', 'bg-emerald-600/20');
                    btn.classList.replace('text-indigo-400', 'text-emerald-400');
                    title.innerText = 'Accomplished Orders';
                } else {
                    btn.innerHTML = 'Show History';
                    btn.classList.replace('bg-emerald-600/20', 'bg-indigo-600/20');
                    btn.classList.replace('text-emerald-400', 'text-indigo-400');
                    title.innerText = 'Live Order Feed';
                }
                
                // Re-fetch or re-render
                ordersRef.once('value', renderDashboard);
            };

            function updateStats(tot, p, c) {
                totO.innerText = tot;
                totP.innerText = p;
                totC.innerText = c;
            }

            // Notification Helpers
            function requestNotificationPermission() {
                if ("Notification" in window) {
                    Notification.requestPermission();
                }
            }
            requestNotificationPermission();

            function showBrowserNotification(title, body) {
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification(title, {
                        body: body,
                        icon: "https://cdn-icons-png.flaticon.com/512/3135/3135715.png" // Placeholder hotel icon
                    });
                }
            }

            window.handleStatusChange = function (orderId, newStatus, roomNumber) {
                // Open the confirmation modal instead of updating immediately
                const modal = document.getElementById('confirm-modal');
                const modalOrderId = document.getElementById('modal-order-id');
                const modalNewStatus = document.getElementById('modal-new-status');
                const modalOrderRefId = document.getElementById('modal-order-ref-id');
                const reasonInput = document.getElementById('status-reason-input');

                modalOrderId.innerText = roomNumber;
                modalNewStatus.innerText = newStatus.toUpperCase();
                modalOrderRefId.value = orderId;
                reasonInput.value = ''; // clear previous

                modal.classList.remove('hidden');
                modal.classList.add('flex');
            };

            // Confirmation button handler
            window.confirmStatusUpdate = async function () {
                const orderId = document.getElementById('modal-order-ref-id').value;
                const newStatus = document.getElementById('modal-new-status').innerText.toLowerCase();
                const reason = document.getElementById('status-reason-input').value.trim();
                const modal = document.getElementById('confirm-modal');

                try {
                    const updateData = { status: newStatus };
                    if (reason) updateData.statusReason = reason;

                    await database.ref('orders/' + orderId).update(updateData);
                    showToast(`Updated to ${newStatus}.`);

                    closeModal();
                } catch (error) {
                    console.error("Error updating status: ", error);
                    showToast("Error updating status.", true);
                }
            };

            window.toggleMute = function () {
                isMuted = !isMuted;
                const btn = document.getElementById('mute-btn');
                if (isMuted) {
                    btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" /></svg>';
                    showToast("Sound Muted");
                } else {
                    btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" /></svg>';
                    showToast("Sound Enabled");
                    // Play a quick silent sound to "unlock" audio on mobile/browsers
                    notificationSound.play().catch(() => { });
                }
            };

            window.closeModal = function () {
                const modal = document.getElementById('confirm-modal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');

                // Reset select value to original if possible (standard onValue will handle this anyway)
            };
        });
    </script>
</head>

<body class="p-4 md:p-8">
    <header class="glass-card rounded-3xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-4">
            <div
                class="h-12 w-12 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                    </path>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white mb-0.5">Kitchen Console</h1>
                <p class="text-sm text-indigo-200/80 font-medium">Azal Hotel Live Orders</p>
            </div>
            <!-- Sound Toggle -->
            <button id="mute-btn" onclick="toggleMute()"
                class="ml-4 p-2.5 rounded-xl glass-card hover:bg-white/10 text-indigo-300 transition-all border border-indigo-500/20"
                title="Toggle Sound">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
            </button>
        </div>

        <div class="flex items-center gap-6 text-center">
            <div class="glass-card rounded-xl px-5 py-2">
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Total</p>
                <p class="text-xl font-bold text-white" id="tot-orders">-</p>
            </div>
            <div class="glass-card rounded-xl px-5 py-2">
                <p class="text-xs text-yellow-500/80 uppercase tracking-widest mb-1">Pending</p>
                <p class="text-xl font-bold text-yellow-400" id="tot-pending">-</p>
            </div>
            <div class="glass-card rounded-xl px-5 py-2">
                <p class="text-xs text-green-500/80 uppercase tracking-widest mb-1">Done</p>
                <p class="text-xl font-bold text-green-400" id="tot-completed">-</p>
            </div>
        </div>
    </header>

    <main>
        <div class="flex justify-between items-center mb-6 px-2">
            <h2 id="feed-title" class="text-xl font-semibold text-white tracking-wide">Live Order Feed</h2>
            <div class="flex items-center gap-4">
                <button id="view-toggle-btn" onclick="toggleView()"
                    class="py-1.5 px-4 rounded-lg bg-indigo-600/20 text-indigo-400 text-xs font-bold border border-indigo-500/30 hover:bg-indigo-600/30 transition-all uppercase tracking-widest">
                    Show History
                </button>
                <div class="flex items-center gap-2 text-sm text-gray-400">
                    <span class="relative flex h-3 w-3">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    Live Sync
                </div>
            </div>
        </div>

        <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full py-20 flex flex-col items-center justify-center">
                <svg class="animate-spin h-8 w-8 text-indigo-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <p class="text-gray-400 font-medium tracking-wide">Connecting to Azal Database...</p>
            </div>
        </div>
    </main>

    <!-- Modal for Confirmation & Reason -->
    <div id="confirm-modal"
        class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div
            class="glass-card w-full max-w-md rounded-3xl p-8 transform transition-all animate-in fade-in zoom-in duration-300">
            <div class="text-center mb-6">
                <div
                    class="h-16 w-16 rounded-2xl bg-indigo-500/20 flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Confirm Update</h2>
                <p class="text-gray-400 text-sm">Room <span id="modal-order-id" class="text-white font-bold"></span> ➔
                    <span id="modal-new-status" class="text-indigo-400 font-bold"></span>
                </p>
            </div>

            <div class="mb-6">
                <label class="block text-xs text-gray-400 mb-2 uppercase tracking-widest font-bold">Reason
                    (Optional)</label>
                <textarea id="status-reason-input" placeholder="e.g., Kitchen is busy, Out of stock, etc."
                    class="w-full bg-slate-900/50 border border-slate-700/50 rounded-xl p-4 text-white text-sm focus:ring-2 focus:ring-indigo-500/50 outline-none transition-all resize-none h-24"></textarea>
            </div>

            <input type="hidden" id="modal-order-ref-id">

            <div class="grid grid-cols-2 gap-4">
                <button onclick="closeModal()"
                    class="py-3 px-6 rounded-xl border border-slate-700 text-gray-400 font-semibold hover:bg-slate-800 transition-colors">Cancel</button>
                <button onclick="confirmStatusUpdate()"
                    class="py-3 px-6 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-500 shadow-lg shadow-indigo-600/20 transition-all">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

    <audio id="notification-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        function showToast(message, isError = false) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `glass-card px-4 py-3 rounded-xl shadow-xl border-l-4 flex items-center gap-3 transition-opacity duration-300 ${isError ? 'border-red-500 text-red-100' : 'border-emerald-500 text-emerald-100'}`;
            toast.innerHTML = `
                <svg class="w-5 h-5 ${isError ? 'text-red-400' : 'text-emerald-400'}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    ${isError
                    ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>'
                    : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>'}
                </svg>
                <p class="text-sm font-medium">${message}</p>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>

</html>
